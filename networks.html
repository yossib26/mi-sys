<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ניהול רשתות</title>
<style>
  :root {
    --navy: #33475b;
    --bg: #f5f8fa;
    --card: #ffffff;
    --border: #e5e8ec;
    --border-strong: #cbd6e2;
    --text: #33475b;
    --muted: #7c98b6;
    --accent: #0091ae;
    --accent-soft: #eaf7f8;
    --brand: #ff7a59;
    --brand-dark: #e66e50;
    --accent-text: #ffffff;
    --danger: #e0455a;
    --danger-soft: #fdeef0;
    --radius: 4px;
    --radius-lg: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  .topnav {
    background: var(--navy); color: #fff; display: flex; align-items: center;
    gap: 20px; padding: 0 24px; height: 56px;
  }
  .topnav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; color: #fff; white-space: nowrap; }
  .topnav-brand .mark {
    width: 28px; height: 28px; border-radius: 6px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; color: #fff;
  }
  .topnav-links { display: flex; align-items: center; gap: 2px; flex: 1; }
  .topnav-links a {
    color: #cbd6e2; text-decoration: none; font-size: 0.86rem; font-weight: 500;
    padding: 8px 12px; border-radius: var(--radius); transition: background 0.15s ease, color 0.15s ease;
  }
  .topnav-links a:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
  .topnav-links a.active { color: #fff; background: rgba(255, 255, 255, 0.14); }
  .topnav-user { display: flex; align-items: center; gap: 12px; font-size: 0.82rem; color: #cbd6e2; white-space: nowrap; }
  .topnav-user .topnav-user-name { color: #fff; font-weight: 600; }
  .topnav-user a { color: #cbd6e2; text-decoration: none; }
  .topnav-user a:hover { color: #fff; }
  h1 { font-size: 1.65rem; font-weight: 500; margin: 0 0 4px; letter-spacing: -0.01em; color: var(--navy); }
  p.subtitle { color: var(--muted); margin: 0; font-size: 0.88rem; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 20px; }
  .page-head { padding-bottom: 20px; border-bottom: 1px solid var(--border-strong); margin-bottom: 4px; }
  section.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 26px;
  }
  section.card h2 { margin: 0 0 18px; font-size: 1rem; font-weight: 600; color: var(--navy); }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
  input {
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    min-width: 0;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--brand);
    color: var(--accent-text);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--brand-dark); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--navy);
    font-weight: 500;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  button.ghost:hover { background: var(--bg); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.danger:hover { background: var(--danger); color: #fff; }
  .msg { font-size: 0.85rem; margin: 0 0 10px; min-height: 1.1em; }
  .msg.error { color: var(--danger); }
  .msg.success { color: #2fa968; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { background: var(--bg); color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:hover { background: var(--accent-soft); }
  .empty { color: var(--muted); font-style: italic; }
  .row-actions { display: flex; gap: 6px; }
  .edit-row-input { width: 100%; }
  .logo-cell { display: flex; align-items: center; gap: 8px; }
  .logo-thumb { width: 32px; height: 32px; object-fit: contain; border-radius: 6px; border: 1px solid var(--border-strong); vertical-align: middle; background: var(--card); }
  .upload-label-sm {
    display: inline-block; padding: 5px 10px; font-size: 0.78rem; font-weight: 500;
    border: 1px solid var(--border-strong); border-radius: var(--radius); cursor: pointer;
    background: transparent; color: var(--navy); white-space: nowrap;
  }
  .upload-label-sm:hover { background: var(--bg); }
  .status-badge {
    display: inline-block; padding: 3px 9px; border-radius: 999px;
    font-size: 0.72rem; font-weight: 600; white-space: nowrap;
  }
  .status-badge.on { background: #e6f6ee; color: #1d8a54; }
  .status-badge.off { background: var(--bg); color: var(--muted); }
  /* Dimmed, not hidden — this is the one page an inactive network has
     to stay visible on, so it can be turned back on. */
  tr.row-inactive .cell-name, tr.row-inactive .logo-thumb { opacity: 0.5; }
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav-brand"><span class="mark">MS</span> מערכת קמפיינים</div>
  <nav class="topnav-links" id="topnavLinks"></nav>
  <div class="topnav-user" id="userInfo"></div>
</header>
<main>
  <div class="page-head">
    <h1>ניהול רשתות</h1>
    <p class="subtitle">קטלוג רשתות (למשל רשתות שיווק) גלובלי — לכל קמפיין בוחרים בעריכתו אילו מהן רלוונטיות לו.</p>
  </div>

  <section class="card">
    <h2>הוספת רשת</h2>
    <form id="networkForm">
      <div class="field">
        <label for="networkName">שם רשת</label>
        <input id="networkName" required placeholder="לדוגמה: שופרסל" />
      </div>
      <div class="field">
        <label>לוגו (רשות)</label>
        <label class="upload-label-sm" for="networkLogoInput" id="networkLogoLabel">בחר קובץ…</label>
        <input id="networkLogoInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
      </div>
      <img class="logo-thumb" id="networkLogoPreview" alt="" hidden />
      <button type="submit">הוסף רשת</button>
    </form>
    <p class="msg" id="formMsg"></p>
  </section>

  <section class="card">
    <h2>רשתות קיימות</h2>
    <table>
      <thead>
        <tr>
          <th>שם רשת</th>
          <th>לוגו</th>
          <th>סטטוס</th>
          <th>נוצרה בתאריך</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="networkRows">
        <tr><td colspan="5" class="empty">טוען…</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Shared across index/edit/users/brands/networks.html (each page
  // keeps its own copy — this app has no build step to share JS
  // across static pages). Populates the navy top bar: the nav links
  // (gated to admin-only pages the same way each page already gates
  // itself) and the logged-in user's name/role/logout link.
  const TOPNAV_LINKS = [
    { href: '/', label: 'קמפיינים', adminOnly: false },
    { href: '/users.html', label: 'משתמשים', adminOnly: true },
    { href: '/brands.html', label: 'מותגים', adminOnly: true },
    { href: '/networks.html', label: 'רשתות', adminOnly: true },
    { href: '/sms-settings.html', label: 'הגדרות SMS', adminOnly: true },
  ];
  function renderTopnav(user) {
    const navEl = document.getElementById('topnavLinks');
    if (navEl) {
      navEl.innerHTML = TOPNAV_LINKS
        .filter((l) => !l.adminOnly || user.role === 'admin')
        .map((l) => {
          const isActive = location.pathname === l.href || (l.href === '/' && location.pathname === '/index.html');
          return `<a href="${l.href}" class="${isActive ? 'active' : ''}">${l.label}</a>`;
        })
        .join('');
    }
    document.getElementById('userInfo').innerHTML = `
      <span class="topnav-user-name">${escapeHtml(user.username)}</span>
      <span>${user.role === 'admin' ? 'אדמין' : 'משתמש רגיל'}</span>
      <a href="#" id="logoutLink">התנתקות</a>
    `;
    document.getElementById('logoutLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/login.html';
    });
  }

  function showMsg(elId, text, kind) {
    const node = document.getElementById(elId);
    node.textContent = text || '';
    node.className = 'msg' + (kind ? ' ' + kind : '');
  }

  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    let data = null;
    if (res.status !== 204) data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.error) || `שגיאה (${res.status})`);
    return data;
  }

  // Populated by loadNetworks(), read back when entering edit mode so
  // the logo cell knows whether to offer "הסר" without a fresh request.
  let networksCache = [];

  function fileToDataUri(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('קריאת הקובץ נכשלה'));
      reader.readAsDataURL(file);
    });
  }

  function logoCellHtml(n) {
    return n.has_logo
      ? `<img class="logo-thumb" src="/api/networks/${n.id}/logo" alt="" />`
      : '<span class="empty">אין לוגו</span>';
  }

  // An inactive network is dimmed rather than hidden — this is the
  // catalog page, the one place it must stay visible and reactivatable.
  // Everywhere else (the campaign editor, the public page) the server
  // filters it out.
  function renderRow(n) {
    return `
      <tr data-row-for="${n.id}" class="${n.active ? '' : 'row-inactive'}">
        <td><span class="cell-name">${escapeHtml(n.name)}</span></td>
        <td class="logo-cell">${logoCellHtml(n)}</td>
        <td><span class="status-badge ${n.active ? 'on' : 'off'}">${n.active ? 'פעילה' : 'לא פעילה'}</span></td>
        <td>${new Date(n.created_at).toLocaleDateString('he-IL')}</td>
        <td class="row-actions">
          <button class="ghost" data-toggle-network="${n.id}">${n.active ? 'השבת' : 'הפעל'}</button>
          <button class="ghost" data-edit-network="${n.id}">ערוך</button>
          <button class="ghost danger" data-delete-network="${n.id}">מחק</button>
        </td>
      </tr>
    `;
  }

  async function loadNetworks() {
    const rowsEl = document.getElementById('networkRows');
    try {
      // include_inactive: this page manages the whole catalog, unlike
      // the campaign editor, which only ever sees active networks.
      networksCache = await api('/api/networks?include_inactive=1');
    } catch (error) {
      rowsEl.innerHTML = `<tr><td colspan="5" class="empty">${escapeHtml(error.message)}</td></tr>`;
      return;
    }

    if (networksCache.length === 0) {
      rowsEl.innerHTML = '<tr><td colspan="5" class="empty">אין עדיין רשתות.</td></tr>';
      return;
    }

    rowsEl.innerHTML = networksCache.map(renderRow).join('');
  }

  // The logo chosen in the add form, held as a data URI until the
  // network is created — it rides along with the POST rather than
  // needing a second upload request.
  let pendingLogoDataUri = null;

  document.getElementById('networkLogoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const label = document.getElementById('networkLogoLabel');
    const preview = document.getElementById('networkLogoPreview');
    if (!file) {
      pendingLogoDataUri = null;
      label.textContent = 'בחר קובץ…';
      preview.hidden = true;
      return;
    }
    const MAX = 1 * 1024 * 1024; // 1MB — matches MAX_LOGO_BYTES in lib/handlers.js
    if (file.size > MAX) {
      showMsg('formMsg', 'הקובץ גדול מדי (מקסימום 1MB)', 'error');
      e.target.value = '';
      return;
    }
    pendingLogoDataUri = await fileToDataUri(file);
    label.textContent = file.name;
    preview.src = pendingLogoDataUri;
    preview.hidden = false;
    showMsg('formMsg', '');
  });

  function resetAddForm(form) {
    form.reset();
    pendingLogoDataUri = null;
    document.getElementById('networkLogoLabel').textContent = 'בחר קובץ…';
    document.getElementById('networkLogoPreview').hidden = true;
  }

  document.getElementById('networkForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('networkName').value.trim();
    if (!name) return;
    const payload = { name };
    if (pendingLogoDataUri) payload.image = pendingLogoDataUri;
    try {
      await api('/api/networks', { method: 'POST', body: JSON.stringify(payload) });
      resetAddForm(e.target);
      showMsg('formMsg', '');
      await loadNetworks();
    } catch (error) {
      showMsg('formMsg', error.message, 'error');
    }
  });

  function logoEditCellHtml(n) {
    return `
      ${n.has_logo
        ? `<img class="logo-thumb" src="/api/networks/${n.id}/logo" alt="" /><button type="button" class="ghost danger" data-remove-logo="${n.id}">הסר</button>`
        : ''}
      <label class="upload-label-sm">
        ${n.has_logo ? 'החלף' : 'העלה'}
        <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-logo-input="${n.id}" hidden />
      </label>
    `;
  }

  document.getElementById('networkRows').addEventListener('click', async (e) => {
    const editId = e.target.getAttribute('data-edit-network');
    if (editId) {
      const row = document.querySelector(`tr[data-row-for="${editId}"]`);
      const network = networksCache.find((n) => String(n.id) === editId);
      const currentName = row.children[0].querySelector('.cell-name').textContent;
      row.children[0].innerHTML = `<input class="edit-row-input" value="${currentName.replace(/"/g, '&quot;')}" />`;
      row.children[1].innerHTML = logoEditCellHtml(network);
      row.children[3].innerHTML = `
        <button data-save-network="${editId}">שמור</button>
        <button class="ghost" data-cancel-network="${editId}">ביטול</button>
      `;
      row.querySelector('input').focus();
      return;
    }

    const cancelId = e.target.getAttribute('data-cancel-network');
    if (cancelId) {
      await loadNetworks();
      return;
    }

    const saveId = e.target.getAttribute('data-save-network');
    if (saveId) {
      const row = document.querySelector(`tr[data-row-for="${saveId}"]`);
      const newName = row.querySelector('input').value.trim();
      if (!newName) return;
      try {
        await api(`/api/networks/${saveId}`, { method: 'PUT', body: JSON.stringify({ name: newName }) });
        showMsg('formMsg', '');
        await loadNetworks();
      } catch (error) {
        showMsg('formMsg', error.message, 'error');
      }
      return;
    }

    const removeLogoId = e.target.getAttribute('data-remove-logo');
    if (removeLogoId) {
      if (!confirm('להסיר את הלוגו?')) return;
      try {
        await api(`/api/networks/${removeLogoId}/logo`, { method: 'DELETE' });
        showMsg('formMsg', '');
        await loadNetworks();
      } catch (error) {
        showMsg('formMsg', error.message, 'error');
      }
      return;
    }

    // Deactivating is the gentle alternative to deleting: the network
    // disappears from the campaign editor and the public page, but
    // keeps its rows, so turning it back on restores every campaign's
    // existing selection.
    const toggleId = e.target.getAttribute('data-toggle-network');
    if (toggleId) {
      const network = networksCache.find((n) => String(n.id) === String(toggleId));
      try {
        await api(`/api/networks/${toggleId}`, {
          method: 'PUT',
          body: JSON.stringify({ active: !(network && network.active) }),
        });
        await loadNetworks();
      } catch (error) {
        showMsg('formMsg', error.message, 'error');
      }
      return;
    }

    const deleteId = e.target.getAttribute('data-delete-network');
    if (deleteId) {
      if (!confirm('למחוק את הרשת? היא תוסר מכל הקמפיינים שסימנו אותה כרלוונטית. אם המטרה היא רק להסתיר אותה זמנית, עדיף להשבית.')) return;
      try {
        await api(`/api/networks/${deleteId}`, { method: 'DELETE' });
        await loadNetworks();
      } catch (error) {
        showMsg('formMsg', error.message, 'error');
      }
    }
  });

  document.getElementById('networkRows').addEventListener('change', async (e) => {
    const logoId = e.target.getAttribute('data-logo-input');
    if (!logoId) return;
    const file = e.target.files[0];
    if (!file) return;
    const MAX = 1 * 1024 * 1024; // 1MB — matches MAX_LOGO_BYTES in lib/handlers.js
    if (file.size > MAX) {
      showMsg('formMsg', 'הקובץ גדול מדי (מקסימום 1MB)', 'error');
      e.target.value = '';
      return;
    }
    try {
      const dataUri = await fileToDataUri(file);
      await api(`/api/networks/${logoId}/logo`, { method: 'PUT', body: JSON.stringify({ image: dataUri }) });
      showMsg('formMsg', 'הלוגו עודכן', 'success');
      await loadNetworks();
    } catch (error) {
      showMsg('formMsg', error.message, 'error');
    }
  });

  // Session now uses an IDLE timeout (10 minutes, see SESSION_TTL_MS
  // in lib/auth.js), not a fixed lifetime from login: any real
  // activity on this page (mouse/keyboard/scroll/click) keeps the
  // session alive by re-minting the cookie via POST /api/auth/refresh
  // roughly every 30s; once idle that long, it logs out and sends the
  // admin back to the login screen proactively, not just on their
  // next click.
  const IDLE_TIMEOUT_MS = 10 * 60 * 1000;
  let lastActivityAt = Date.now();
  ['mousedown', 'mousemove', 'keydown', 'scroll', 'click', 'touchstart'].forEach((evt) => {
    document.addEventListener(evt, () => { lastActivityAt = Date.now(); }, { passive: true });
  });

  function startSessionWatchdog() {
    setInterval(async () => {
      if (Date.now() - lastActivityAt >= IDLE_TIMEOUT_MS) {
        await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
        location.href = '/login.html';
        return;
      }
      const res = await fetch('/api/auth/refresh', { method: 'POST' });
      if (!res.ok) location.href = '/login.html';
    }, 30 * 1000);
  }

  (async () => {
    try {
      const me = await api('/api/auth/me');
      if (me.role !== 'admin') {
        location.href = '/';
        return;
      }
      renderTopnav(me);
      await loadNetworks();
      startSessionWatchdog();
    } catch {
      location.href = '/login.html';
    }
  })();
</script>
</body>
</html>
