<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ניהול מותגים</title>
<style>
  :root {
    --bg: #fbfbfc;
    --card: #ffffff;
    --border: #f0f1f4;
    --border-strong: #e6e7eb;
    --text: #2c2e33;
    --muted: #9a9ea8;
    --accent: #4361ee;
    --accent-text: #ffffff;
    --danger: #e0455a;
    --danger-soft: #fdeef0;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.45rem; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.subtitle { color: var(--muted); margin: 0 0 28px; font-size: 0.9rem; }
  main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  section.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 26px;
  }
  section.card h2 { margin: 0 0 18px; font-size: 1rem; font-weight: 600; }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
  input {
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    min-width: 0;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-weight: 500;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  button.ghost:hover { background: var(--bg); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.danger:hover { filter: none; background: var(--danger); color: #fff; }
  .msg { font-size: 0.85rem; margin: 0 0 10px; min-height: 1.1em; }
  .msg.error { color: var(--danger); }
  .msg.success { color: #2fa968; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .empty { color: var(--muted); font-style: italic; }
  .row-actions { display: flex; gap: 6px; }
  .edit-row-input { width: 100%; }
  .back-link { display: inline-block; margin-bottom: 4px; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <div>
    <a class="back-link" href="/">← חזרה לרשימת הקמפיינים</a>
    <h1>ניהול מותגים</h1>
    <p class="subtitle">הוספה ועריכה של מותגים</p>
  </div>

  <section class="card">
    <h2>הוספת מותג</h2>
    <form id="brandForm">
      <div class="field">
        <label for="brandName">שם מותג</label>
        <input id="brandName" required placeholder="לדוגמה: Nike" />
      </div>
      <button type="submit">הוסף מותג</button>
    </form>
    <p class="msg" id="formMsg"></p>
  </section>

  <section class="card">
    <h2>מותגים קיימים</h2>
    <table>
      <thead>
        <tr>
          <th>שם מותג</th>
          <th>נוצר בתאריך</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="brandRows">
        <tr><td colspan="3" class="empty">טוען…</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function showMsg(elId, text, kind) {
    const node = document.getElementById(elId);
    node.textContent = text || '';
    node.className = 'msg' + (kind ? ' ' + kind : '');
  }

  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    let data = null;
    if (res.status !== 204) data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.error) || `שגיאה (${res.status})`);
    return data;
  }

  function renderRow(b) {
    return `
      <tr data-row-for="${b.id}">
        <td>${escapeHtml(b.name)}</td>
        <td>${new Date(b.created_at).toLocaleDateString('he-IL')}</td>
        <td class="row-actions">
          <button class="ghost" data-edit-brand="${b.id}">ערוך</button>
          <button class="ghost danger" data-delete-brand="${b.id}">מחק</button>
        </td>
      </tr>
    `;
  }

  async function loadBrands() {
    const rowsEl = document.getElementById('brandRows');
    let list;
    try {
      list = await api('/api/brands');
    } catch (error) {
      rowsEl.innerHTML = `<tr><td colspan="3" class="empty">${escapeHtml(error.message)}</td></tr>`;
      return;
    }

    if (list.length === 0) {
      rowsEl.innerHTML = '<tr><td colspan="3" class="empty">אין עדיין מותגים.</td></tr>';
      return;
    }

    rowsEl.innerHTML = list.map(renderRow).join('');
  }

  document.getElementById('brandForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('brandName').value.trim();
    if (!name) return;
    try {
      await api('/api/brands', { method: 'POST', body: JSON.stringify({ name }) });
      e.target.reset();
      showMsg('formMsg', '');
      await loadBrands();
    } catch (error) {
      showMsg('formMsg', error.message, 'error');
    }
  });

  document.getElementById('brandRows').addEventListener('click', async (e) => {
    const editId = e.target.getAttribute('data-edit-brand');
    if (editId) {
      const row = document.querySelector(`tr[data-row-for="${editId}"]`);
      const currentName = row.children[0].textContent;
      row.children[0].innerHTML = `<input class="edit-row-input" value="${currentName.replace(/"/g, '&quot;')}" />`;
      row.children[2].innerHTML = `
        <button data-save-brand="${editId}">שמור</button>
        <button class="ghost" data-cancel-brand="${editId}">ביטול</button>
      `;
      row.querySelector('input').focus();
      return;
    }

    const cancelId = e.target.getAttribute('data-cancel-brand');
    if (cancelId) {
      await loadBrands();
      return;
    }

    const saveId = e.target.getAttribute('data-save-brand');
    if (saveId) {
      const row = document.querySelector(`tr[data-row-for="${saveId}"]`);
      const newName = row.querySelector('input').value.trim();
      if (!newName) return;
      try {
        await api(`/api/brands/${saveId}`, { method: 'PUT', body: JSON.stringify({ name: newName }) });
        showMsg('formMsg', '');
        await loadBrands();
      } catch (error) {
        showMsg('formMsg', error.message, 'error');
      }
      return;
    }

    const deleteId = e.target.getAttribute('data-delete-brand');
    if (deleteId) {
      if (!confirm('למחוק את המותג? כל הקמפיינים שלו יימחקו גם הם.')) return;
      try {
        await api(`/api/brands/${deleteId}`, { method: 'DELETE' });
        await loadBrands();
      } catch (error) {
        showMsg('formMsg', error.message, 'error');
      }
    }
  });

  (async () => {
    try {
      const me = await api('/api/auth/me');
      if (me.role !== 'admin') {
        location.href = '/';
        return;
      }
      await loadBrands();
    } catch {
      location.href = '/login.html';
    }
  })();
</script>
</body>
</html>
