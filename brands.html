<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ניהול מותגים</title>
<style>
  :root {
    --navy: #33475b;
    --bg: #f5f8fa;
    --card: #ffffff;
    --border: #e5e8ec;
    --border-strong: #cbd6e2;
    --text: #33475b;
    --muted: #7c98b6;
    --accent: #0091ae;
    --accent-soft: #eaf7f8;
    --brand: #ff7a59;
    --brand-dark: #e66e50;
    --accent-text: #ffffff;
    --danger: #e0455a;
    --danger-soft: #fdeef0;
    --radius: 4px;
    --radius-lg: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  .topnav {
    background: var(--navy); color: #fff; display: flex; align-items: center;
    gap: 20px; padding: 0 24px; height: 56px;
  }
  .topnav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; color: #fff; white-space: nowrap; }
  .topnav-brand .mark {
    width: 28px; height: 28px; border-radius: 6px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; color: #fff;
  }
  .topnav-links { display: flex; align-items: center; gap: 2px; flex: 1; }
  .topnav-links a {
    color: #cbd6e2; text-decoration: none; font-size: 0.86rem; font-weight: 500;
    padding: 8px 12px; border-radius: var(--radius); transition: background 0.15s ease, color 0.15s ease;
  }
  .topnav-links a:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
  .topnav-links a.active { color: #fff; background: rgba(255, 255, 255, 0.14); }
  .topnav-user { display: flex; align-items: center; gap: 12px; font-size: 0.82rem; color: #cbd6e2; white-space: nowrap; }
  .topnav-user .topnav-user-name { color: #fff; font-weight: 600; }
  .topnav-user a { color: #cbd6e2; text-decoration: none; }
  .topnav-user a:hover { color: #fff; }
  h1 { font-size: 1.65rem; font-weight: 500; margin: 0 0 4px; letter-spacing: -0.01em; color: var(--navy); }
  p.subtitle { color: var(--muted); margin: 0; font-size: 0.88rem; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 20px; }
  .page-head { padding-bottom: 20px; border-bottom: 1px solid var(--border-strong); margin-bottom: 4px; }
  section.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 26px;
  }
  section.card h2 { margin: 0 0 18px; font-size: 1rem; font-weight: 600; color: var(--navy); }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
  input {
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    min-width: 0;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--brand);
    color: var(--accent-text);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--brand-dark); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--navy);
    font-weight: 500;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  button.ghost:hover { background: var(--bg); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.danger:hover { background: var(--danger); color: #fff; }
  .msg { font-size: 0.85rem; margin: 0 0 10px; min-height: 1.1em; }
  .msg.error { color: var(--danger); }
  .msg.success { color: #2fa968; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { background: var(--bg); color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:hover { background: var(--accent-soft); }
  .avatar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; color: #fff;
    font-size: 0.72rem; font-weight: 700; margin-inline-end: 8px; flex: none; vertical-align: middle;
  }
  .empty { color: var(--muted); font-style: italic; }
  .row-actions { display: flex; gap: 6px; }
  .edit-row-input { width: 100%; }
  .back-link { display: inline-block; margin-bottom: 4px; font-size: 0.9rem; }
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav-brand"><span class="mark">MS</span> מערכת קמפיינים</div>
  <nav class="topnav-links" id="topnavLinks"></nav>
  <div class="topnav-user" id="userInfo"></div>
</header>
<main>
  <div class="page-head">
    <h1>ניהול מותגים</h1>
    <p class="subtitle">הוספה ועריכה של מותגים</p>
  </div>

  <section class="card">
    <h2>הוספת מותג</h2>
    <form id="brandForm">
      <div class="field">
        <label for="brandName">שם מותג</label>
        <input id="brandName" required placeholder="לדוגמה: Nike" />
      </div>
      <button type="submit">הוסף מותג</button>
    </form>
    <p class="msg" id="formMsg"></p>
  </section>

  <section class="card">
    <h2>מותגים קיימים</h2>
    <table>
      <thead>
        <tr>
          <th>שם מותג</th>
          <th>נוצר בתאריך</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="brandRows">
        <tr><td colspan="3" class="empty">טוען…</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Shared across index/edit/users/brands.html (each page keeps its own
  // copy — this app has no build step to share JS across static pages).
  // Populates the navy top bar: the nav links (gated to admin-only
  // pages the same way each page already gates itself) and the
  // logged-in user's name/role/logout link.
  const TOPNAV_LINKS = [
    { href: '/', label: 'קמפיינים', adminOnly: false },
    { href: '/users.html', label: 'משתמשים', adminOnly: true },
    { href: '/brands.html', label: 'מותגים', adminOnly: true },
  ];
  const AVATAR_COLORS = ['#0091ae', '#33475b', '#ff7a59', '#00a4bd', '#7c98b6', '#516f90'];
  function avatarColor(str) {
    let h = 0;
    for (let i = 0; i < String(str).length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function avatarHtml(name) {
    const initial = (name || '?').trim().charAt(0).toUpperCase() || '?';
    return `<span class="avatar" style="background:${avatarColor(name || '')}">${escapeHtml(initial)}</span>`;
  }
  function renderTopnav(user) {
    const navEl = document.getElementById('topnavLinks');
    if (navEl) {
      navEl.innerHTML = TOPNAV_LINKS
        .filter((l) => !l.adminOnly || user.role === 'admin')
        .map((l) => {
          const isActive = location.pathname === l.href || (l.href === '/' && location.pathname === '/index.html');
          return `<a href="${l.href}" class="${isActive ? 'active' : ''}">${l.label}</a>`;
        })
        .join('');
    }
    document.getElementById('userInfo').innerHTML = `
      <span class="topnav-user-name">${escapeHtml(user.username)}</span>
      <span>${user.role === 'admin' ? 'אדמין' : 'משתמש רגיל'}</span>
      <a href="#" id="logoutLink">התנתקות</a>
    `;
    document.getElementById('logoutLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/login.html';
    });
  }

  function showMsg(elId, text, kind) {
    const node = document.getElementById(elId);
    node.textContent = text || '';
    node.className = 'msg' + (kind ? ' ' + kind : '');
  }

  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    let data = null;
    if (res.status !== 204) data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.error) || `שגיאה (${res.status})`);
    return data;
  }

  function renderRow(b) {
    return `
      <tr data-row-for="${b.id}">
        <td>${avatarHtml(b.name)}<span class="cell-name">${escapeHtml(b.name)}</span></td>
        <td>${new Date(b.created_at).toLocaleDateString('he-IL')}</td>
        <td class="row-actions">
          <button class="ghost" data-edit-brand="${b.id}">ערוך</button>
          <button class="ghost danger" data-delete-brand="${b.id}">מחק</button>
        </td>
      </tr>
    `;
  }

  async function loadBrands() {
    const rowsEl = document.getElementById('brandRows');
    let list;
    try {
      list = await api('/api/brands');
    } catch (error) {
      rowsEl.innerHTML = `<tr><td colspan="3" class="empty">${escapeHtml(error.message)}</td></tr>`;
      return;
    }

    if (list.length === 0) {
      rowsEl.innerHTML = '<tr><td colspan="3" class="empty">אין עדיין מותגים.</td></tr>';
      return;
    }

    rowsEl.innerHTML = list.map(renderRow).join('');
  }

  document.getElementById('brandForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('brandName').value.trim();
    if (!name) return;
    try {
      await api('/api/brands', { method: 'POST', body: JSON.stringify({ name }) });
      e.target.reset();
      showMsg('formMsg', '');
      await loadBrands();
    } catch (error) {
      showMsg('formMsg', error.message, 'error');
    }
  });

  document.getElementById('brandRows').addEventListener('click', async (e) => {
    const editId = e.target.getAttribute('data-edit-brand');
    if (editId) {
      const row = document.querySelector(`tr[data-row-for="${editId}"]`);
      const currentName = row.children[0].querySelector('.cell-name').textContent;
      row.children[0].innerHTML = `<input class="edit-row-input" value="${currentName.replace(/"/g, '&quot;')}" />`;
      row.children[2].innerHTML = `
        <button data-save-brand="${editId}">שמור</button>
        <button class="ghost" data-cancel-brand="${editId}">ביטול</button>
      `;
      row.querySelector('input').focus();
      return;
    }

    const cancelId = e.target.getAttribute('data-cancel-brand');
    if (cancelId) {
      await loadBrands();
      return;
    }

    const saveId = e.target.getAttribute('data-save-brand');
    if (saveId) {
      const row = document.querySelector(`tr[data-row-for="${saveId}"]`);
      const newName = row.querySelector('input').value.trim();
      if (!newName) return;
      try {
        await api(`/api/brands/${saveId}`, { method: 'PUT', body: JSON.stringify({ name: newName }) });
        showMsg('formMsg', '');
        await loadBrands();
      } catch (error) {
        showMsg('formMsg', error.message, 'error');
      }
      return;
    }

    const deleteId = e.target.getAttribute('data-delete-brand');
    if (deleteId) {
      if (!confirm('למחוק את המותג? כל הקמפיינים שלו יימחקו גם הם.')) return;
      try {
        await api(`/api/brands/${deleteId}`, { method: 'DELETE' });
        await loadBrands();
      } catch (error) {
        showMsg('formMsg', error.message, 'error');
      }
    }
  });

  // Session now uses an IDLE timeout (10 minutes, see SESSION_TTL_MS
  // in lib/auth.js), not a fixed lifetime from login: any real
  // activity on this page (mouse/keyboard/scroll/click) keeps the
  // session alive by re-minting the cookie via POST /api/auth/refresh
  // roughly every 30s; once idle that long, it logs out and sends the
  // admin back to the login screen proactively, not just on their
  // next click.
  const IDLE_TIMEOUT_MS = 10 * 60 * 1000;
  let lastActivityAt = Date.now();
  ['mousedown', 'mousemove', 'keydown', 'scroll', 'click', 'touchstart'].forEach((evt) => {
    document.addEventListener(evt, () => { lastActivityAt = Date.now(); }, { passive: true });
  });

  function startSessionWatchdog() {
    setInterval(async () => {
      if (Date.now() - lastActivityAt >= IDLE_TIMEOUT_MS) {
        await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
        location.href = '/login.html';
        return;
      }
      const res = await fetch('/api/auth/refresh', { method: 'POST' });
      if (!res.ok) location.href = '/login.html';
    }, 30 * 1000);
  }

  (async () => {
    try {
      const me = await api('/api/auth/me');
      if (me.role !== 'admin') {
        location.href = '/';
        return;
      }
      renderTopnav(me);
      await loadBrands();
      startSessionWatchdog();
    } catch {
      location.href = '/login.html';
    }
  })();
</script>
</body>
</html>
