<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>עריכת קמפיין</title>
<style>
  :root {
    --bg: #fbfbfc;
    --card: #ffffff;
    --border: #f0f1f4;
    --border-strong: #e6e7eb;
    --text: #2c2e33;
    --muted: #9a9ea8;
    --accent: #4361ee;
    --accent-text: #ffffff;
    --danger: #e0455a;
    --danger-soft: #fdeef0;
    --radius: 16px;
  }
  /* Always light — not tied to the OS/browser color scheme. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.subtitle { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
  main { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  section.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 26px;
  }
  section.card h2 { margin: 0 0 18px; font-size: 1.05rem; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
  input, select, textarea {
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    min-width: 0;
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 70px; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.06); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-weight: 500;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  button.ghost:hover { background: var(--bg); filter: none; }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.danger:hover { filter: none; background: var(--danger); color: #fff; }
  .msg { font-size: 0.85rem; margin: 10px 0 0; min-height: 1.1em; }
  .msg.error { color: var(--danger); }
  .msg.success { color: #2fa968; }
  .file-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .banner-preview { max-width: 100%; max-height: 160px; border-radius: 10px; border: 1px solid var(--border); display: block; }
  .file-info { font-size: 0.85rem; color: var(--muted); }
  .upload-label {
    display: inline-block; padding: 7px 14px; font-size: 0.85rem; font-weight: 500;
    border: 1px solid var(--border-strong); border-radius: 10px; cursor: pointer;
    background: transparent; color: var(--text); transition: background 0.15s ease;
  }
  .upload-label:hover { background: var(--bg); }
  .actions { display: flex; gap: 10px; justify-content: flex-start; }
  .back-link { display: inline-block; margin-bottom: 4px; font-size: 0.9rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .empty { color: var(--muted); font-style: italic; }
  .yes { color: #2fa968; font-weight: 600; }
  .no { color: var(--muted); }
  .template-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .template-option {
    border: 2px solid var(--border-strong); border-radius: 12px; padding: 12px;
    cursor: pointer; text-align: center; background: var(--bg); transition: border-color 0.15s ease;
  }
  .template-option:hover { border-color: var(--muted); }
  .template-option.selected { border-color: var(--accent); }
  .template-swatch { display: flex; height: 40px; border-radius: 8px; overflow: hidden; margin-bottom: 8px; border: 1px solid var(--border-strong); }
  .template-swatch span { flex: 1; }
  .template-option .label { font-size: 0.85rem; font-weight: 600; }
  .template-option .default-tag { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); }
  .user-info a { color: var(--text); text-decoration: none; border: 1px solid var(--border-strong); border-radius: 10px; padding: 6px 12px; }
  .user-info a:hover { background: var(--bg); }
</style>
</head>
<body>
<main>
  <div class="top-bar">
    <div>
      <a class="back-link" href="/">← חזרה לרשימת הקמפיינים</a>
      <h1 id="pageTitle">עריכת קמפיין</h1>
      <p class="subtitle" id="pageSubtitle"></p>
    </div>
    <div class="user-info" id="userInfo"></div>
  </div>

  <section class="card">
    <h2>פרטי קמפיין</h2>
    <form id="campaignForm">
      <div class="grid">
        <div class="field">
          <label for="brandId">מותג</label>
          <select id="brandId" required></select>
        </div>
        <div class="field">
          <label for="name">שם קמפיין</label>
          <input id="name" required />
        </div>
        <div class="field wide">
          <label for="description">תיאור</label>
          <textarea id="description"></textarea>
        </div>
        <div class="field">
          <label for="budget">תקציב</label>
          <input id="budget" type="number" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="status">סטטוס</label>
          <select id="status">
            <option value="draft">טיוטה</option>
            <option value="active">פעיל</option>
            <option value="paused">מושהה</option>
            <option value="completed">הושלם</option>
            <option value="cancelled">בוטל</option>
            <option value="archived" id="archivedOption">בארכיון</option>
          </select>
        </div>
        <div class="field">
          <label for="startDate">תאריך התחלה</label>
          <input id="startDate" type="date" />
        </div>
        <div class="field">
          <label for="endDate">תאריך סיום</label>
          <input id="endDate" type="date" />
        </div>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>עיצוב הדף הציבורי</h2>
    <div class="template-grid" id="templateGrid">
      <div class="file-info">טוען…</div>
    </div>
    <p class="msg" id="templateMsg"></p>
  </section>

  <section class="card">
    <h2>באנר שיווקי</h2>
    <div class="file-row" id="bannerRow">
      <span class="file-info">טוען…</span>
    </div>
    <p class="msg" id="bannerMsg"></p>
  </section>

  <div>
    <div class="actions">
      <button type="submit" form="campaignForm">שמור שינויים</button>
    </div>
    <p class="msg" id="formMsg"></p>
  </div>

  <section class="card">
    <h2>נרשמים</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>שם</th>
            <th>אימייל</th>
            <th>אישור שיווקי</th>
            <th>תאריך הרשמה</th>
            <th>חשבונית</th>
          </tr>
        </thead>
        <tbody id="registrationRows">
          <tr><td colspan="5" class="empty">טוען…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
  const id = new URLSearchParams(location.search).get('id');
  if (!id) {
    document.body.innerHTML = '<main><p>חסר מזהה קמפיין (id) בכתובת.</p></main>';
    throw new Error('missing id');
  }

  async function initAuth() {
    const res = await fetch('/api/auth/me');
    if (!res.ok) {
      location.href = '/login.html';
      return false;
    }
    const user = await res.json();
    document.getElementById('userInfo').innerHTML = `
      <span>${escapeHtml(user.username)} · ${user.role === 'admin' ? 'אדמין' : 'משתמש רגיל'}</span>
      <a href="#" id="logoutLink">התנתקות</a>
    `;
    document.getElementById('logoutLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/login.html';
    });
    // Only an admin may archive a campaign (the server enforces this
    // too — this just keeps a regular user from picking it at all).
    if (user.role !== 'admin') {
      document.getElementById('archivedOption').disabled = true;
    }
    return true;
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function showMsg(elId, text, kind) {
    const node = document.getElementById(elId);
    node.textContent = text || '';
    node.className = 'msg' + (kind ? ' ' + kind : '');
  }

  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    let data = null;
    if (res.status !== 204) data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.error) || `שגיאה (${res.status})`);
    return data;
  }

  function fileToDataUri(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('קריאת הקובץ נכשלה'));
      reader.readAsDataURL(file);
    });
  }

  async function loadBrandOptions(selectedId) {
    const brands = await api('/api/brands');
    const select = document.getElementById('brandId');
    select.innerHTML = brands.map((b) => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('');
    select.value = selectedId;
  }

  function renderBanner(campaign) {
    const row = document.getElementById('bannerRow');
    row.innerHTML = `
      ${campaign.has_banner ? `
        <img class="banner-preview" src="/api/campaigns/${campaign.id}/banner" alt="" />
        <button class="ghost danger" id="removeBanner">הסר באנר</button>
      ` : '<span class="file-info">אין באנר עדיין.</span>'}
      <label class="upload-label">
        ${campaign.has_banner ? 'החלף באנר' : 'העלה באנר'}
        <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" id="bannerInput" hidden />
      </label>
    `;

    document.getElementById('bannerInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const MAX = 2 * 1024 * 1024;
      if (file.size > MAX) {
        showMsg('bannerMsg', 'הקובץ גדול מדי (מקסימום 2MB)', 'error');
        e.target.value = '';
        return;
      }
      try {
        const dataUri = await fileToDataUri(file);
        await api(`/api/campaigns/${id}/banner`, { method: 'PUT', body: JSON.stringify({ image: dataUri }) });
        showMsg('bannerMsg', 'הבאנר עודכן', 'success');
        await reload();
      } catch (error) {
        showMsg('bannerMsg', error.message, 'error');
      }
    });

    const removeBtn = document.getElementById('removeBanner');
    if (removeBtn) {
      removeBtn.addEventListener('click', async () => {
        if (!confirm('להסיר את הבאנר?')) return;
        try {
          await api(`/api/campaigns/${id}/banner`, { method: 'DELETE' });
          showMsg('bannerMsg', '');
          await reload();
        } catch (error) {
          showMsg('bannerMsg', error.message, 'error');
        }
      });
    }
  }

  async function loadRegistrations() {
    const rowsEl = document.getElementById('registrationRows');
    let registrations;
    try {
      registrations = await api(`/api/campaigns/${id}/registrations`);
    } catch (error) {
      rowsEl.innerHTML = `<tr><td colspan="5" class="empty">${escapeHtml(error.message)}</td></tr>`;
      return;
    }

    if (registrations.length === 0) {
      rowsEl.innerHTML = '<tr><td colspan="5" class="empty">עדיין אין נרשמים.</td></tr>';
      return;
    }

    rowsEl.innerHTML = registrations.map((r) => `
      <tr>
        <td>${escapeHtml(r.first_name)} ${escapeHtml(r.last_name)}</td>
        <td>${escapeHtml(r.email) || '-'}</td>
        <td>${r.marketing_consent ? '<span class="yes">כן</span>' : '<span class="no">לא</span>'}</td>
        <td>${new Date(r.created_at).toLocaleDateString('he-IL')}</td>
        <td><a href="/api/registrations/${r.id}/invoice" target="_blank" rel="noopener">📄 ${escapeHtml(r.invoice_filename) || 'צפה'}</a></td>
      </tr>
    `).join('');
  }

  let selectedTemplate = 'classic';
  const DEFAULT_TEMPLATE = 'classic';

  async function renderTemplates(currentTemplate) {
    selectedTemplate = currentTemplate || DEFAULT_TEMPLATE;
    const grid = document.getElementById('templateGrid');
    let templates;
    try {
      templates = await api('/api/templates');
    } catch (error) {
      grid.innerHTML = `<div class="file-info">${escapeHtml(error.message)}</div>`;
      return;
    }

    grid.innerHTML = templates.map((t) => `
      <div class="template-option ${t.id === selectedTemplate ? 'selected' : ''}" data-template="${t.id}">
        <div class="template-swatch">
          ${t.swatch.map((c) => `<span style="background:${c}"></span>`).join('')}
        </div>
        <span class="label">${escapeHtml(t.label)}${t.id === DEFAULT_TEMPLATE ? '<span class="default-tag">ברירת מחדל</span>' : ''}</span>
      </div>
    `).join('');

    grid.querySelectorAll('.template-option').forEach((el) => {
      el.addEventListener('click', async () => {
        const templateId = el.getAttribute('data-template');
        if (templateId === selectedTemplate) return;
        try {
          await api(`/api/campaigns/${id}`, { method: 'PUT', body: JSON.stringify({ template: templateId }) });
          showMsg('templateMsg', 'העיצוב עודכן', 'success');
          await renderTemplates(templateId);
        } catch (error) {
          showMsg('templateMsg', error.message, 'error');
        }
      });
    });
  }

  async function reload() {
    const campaign = await api(`/api/campaigns/${id}`);
    document.getElementById('pageTitle').textContent = `עריכת קמפיין: ${campaign.name}`;
    document.getElementById('pageSubtitle').textContent = campaign.brand_name;
    await loadBrandOptions(campaign.brand_id);
    document.getElementById('name').value = campaign.name || '';
    document.getElementById('description').value = campaign.description || '';
    document.getElementById('budget').value = campaign.budget ?? '';
    document.getElementById('status').value = campaign.status;
    document.getElementById('startDate').value = campaign.start_date || '';
    document.getElementById('endDate').value = campaign.end_date || '';
    renderBanner(campaign);
    await renderTemplates(campaign.template);
    return campaign;
  }

  document.getElementById('campaignForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      brand_id: Number(document.getElementById('brandId').value),
      name: document.getElementById('name').value.trim(),
      description: document.getElementById('description').value.trim() || null,
      budget: document.getElementById('budget').value ? Number(document.getElementById('budget').value) : null,
      status: document.getElementById('status').value,
      start_date: document.getElementById('startDate').value || null,
      end_date: document.getElementById('endDate').value || null,
    };
    try {
      await api(`/api/campaigns/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
      showMsg('formMsg', 'נשמר בהצלחה', 'success');
    } catch (error) {
      showMsg('formMsg', error.message, 'error');
    }
  });

  initAuth().then((ok) => {
    if (!ok) return;
    Promise.all([reload(), loadRegistrations()]).catch((error) => {
      document.body.innerHTML = `<main><p>שגיאה בטעינת הקמפיין: ${escapeHtml(error.message)}</p></main>`;
    });
  });
</script>
</body>
</html>
