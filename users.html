<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ניהול משתמשים</title>
<style>
  :root {
    --bg: #fbfbfc;
    --card: #ffffff;
    --border: #f0f1f4;
    --border-strong: #e6e7eb;
    --text: #2c2e33;
    --muted: #9a9ea8;
    --accent: #4361ee;
    --accent-text: #ffffff;
    --danger: #e0455a;
    --danger-soft: #fdeef0;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.45rem; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.subtitle { color: var(--muted); margin: 0 0 28px; font-size: 0.9rem; }
  main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; }
  section.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 26px;
  }
  section.card h2 { margin: 0 0 18px; font-size: 1rem; font-weight: 600; }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
  input, select {
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    min-width: 0;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-weight: 500;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  button.ghost:hover { background: var(--bg); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.danger:hover { filter: none; background: var(--danger); color: #fff; }
  .msg { font-size: 0.85rem; margin: 0 0 10px; min-height: 1.1em; }
  .msg.error { color: var(--danger); }
  .msg.success { color: #2fa968; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge-admin { background: #eaf0ff; color: #3151d3; }
  .badge-user { background: #f1f2f4; color: #6b7280; }
  .empty { color: var(--muted); font-style: italic; }
  .back-link { display: inline-block; margin-bottom: 4px; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <a class="back-link" href="/">← חזרה לרשימת הקמפיינים</a>
      <h1>ניהול משתמשים</h1>
      <p class="subtitle">הוספה, הסרה וניהול הרשאות</p>
    </div>
  </header>

  <section class="card">
    <h2>הוספת משתמש</h2>
    <form id="userForm">
      <div class="field">
        <label for="username">שם משתמש</label>
        <input id="username" required />
      </div>
      <div class="field">
        <label for="password">סיסמה</label>
        <input id="password" type="password" required minlength="4" />
      </div>
      <div class="field">
        <label for="role">תפקיד</label>
        <select id="role">
          <option value="user">משתמש רגיל</option>
          <option value="admin">אדמין</option>
        </select>
      </div>
      <button type="submit">הוסף משתמש</button>
    </form>
    <p class="msg" id="formMsg"></p>
  </section>

  <section class="card">
    <h2>משתמשים קיימים</h2>
    <table>
      <thead>
        <tr>
          <th>שם משתמש</th>
          <th>תפקיד</th>
          <th>נוצר בתאריך</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="userRows">
        <tr><td colspan="4" class="empty">טוען…</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function showMsg(elId, text, kind) {
    const node = document.getElementById(elId);
    node.textContent = text || '';
    node.className = 'msg' + (kind ? ' ' + kind : '');
  }

  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    let data = null;
    if (res.status !== 204) data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.error) || `שגיאה (${res.status})`);
    return data;
  }

  let currentUserId = null;

  async function loadUsers() {
    const rowsEl = document.getElementById('userRows');
    let list;
    try {
      list = await api('/api/users');
    } catch (error) {
      rowsEl.innerHTML = `<tr><td colspan="4" class="empty">${escapeHtml(error.message)}</td></tr>`;
      return;
    }

    if (list.length === 0) {
      rowsEl.innerHTML = '<tr><td colspan="4" class="empty">אין משתמשים.</td></tr>';
      return;
    }

    rowsEl.innerHTML = list.map((u) => `
      <tr>
        <td>${escapeHtml(u.username)}</td>
        <td><span class="badge badge-${u.role}">${u.role === 'admin' ? 'אדמין' : 'משתמש רגיל'}</span></td>
        <td>${new Date(u.created_at).toLocaleDateString('he-IL')}</td>
        <td>
          ${u.id === currentUserId ? '<span class="empty">(את/ה)</span>' : `<button class="ghost danger" data-delete-user="${u.id}">מחק</button>`}
        </td>
      </tr>
    `).join('');
  }

  document.getElementById('userForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
      role: document.getElementById('role').value,
    };
    try {
      await api('/api/users', { method: 'POST', body: JSON.stringify(payload) });
      e.target.reset();
      showMsg('formMsg', '');
      await loadUsers();
    } catch (error) {
      showMsg('formMsg', error.message, 'error');
    }
  });

  document.getElementById('userRows').addEventListener('click', async (e) => {
    const id = e.target.getAttribute('data-delete-user');
    if (!id) return;
    if (!confirm('למחוק את המשתמש?')) return;
    try {
      await api(`/api/users/${id}`, { method: 'DELETE' });
      await loadUsers();
    } catch (error) {
      showMsg('formMsg', error.message, 'error');
    }
  });

  (async () => {
    try {
      const me = await api('/api/auth/me');
      if (me.role !== 'admin') {
        location.href = '/';
        return;
      }
      currentUserId = me.id;
      await loadUsers();
    } catch {
      location.href = '/login.html';
    }
  })();
</script>
</body>
</html>
