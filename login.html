<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>התחברות</title>
<style>
  :root {
    --navy: #33475b;
    --bg: #f5f8fa;
    --card: #ffffff;
    --border: #e5e8ec;
    --border-strong: #cbd6e2;
    --text: #33475b;
    --muted: #7c98b6;
    --accent: #0091ae;
    --brand: #ff7a59;
    --brand-dark: #e66e50;
    --accent-text: #ffffff;
    --danger: #e0455a;
    --radius: 4px;
    --radius-lg: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--navy);
    color: var(--text);
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    padding: 34px 30px;
    width: 100%;
    max-width: 340px;
  }
  .brand-mark {
    width: 44px; height: 44px; border-radius: var(--radius-lg);
    background: var(--brand); color: #fff; font-weight: 700; font-size: 1.05rem;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 0 0 22px; text-align: center; color: var(--navy); }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
  input {
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--brand);
    color: var(--accent-text);
    cursor: pointer;
    width: 100%;
    margin-top: 6px;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--brand-dark); }
  .msg { font-size: 0.85rem; margin: 12px 0 0; min-height: 1.1em; text-align: center; }
  .msg.error { color: var(--danger); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">MS</div>
    <h1>מערכת ניהול קמפיינים</h1>
    <form id="loginForm">
      <div class="field">
        <label for="username">שם משתמש</label>
        <input id="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">סיסמה</label>
        <input id="password" type="password" required />
      </div>
      <button type="submit">התחברות</button>
      <p class="msg" id="loginMsg"></p>
    </form>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgEl = document.getElementById('loginMsg');
    msgEl.textContent = '';
    msgEl.className = 'msg';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error((data && data.error) || 'שגיאת התחברות');
      location.href = '/';
    } catch (error) {
      msgEl.textContent = error.message;
      msgEl.className = 'msg error';
    }
  });
</script>
</body>
</html>
