<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>הגדרות SMS</title>
<style>
  :root {
    --navy: #33475b;
    --bg: #f5f8fa;
    --card: #ffffff;
    --border: #e5e8ec;
    --border-strong: #cbd6e2;
    --text: #33475b;
    --muted: #7c98b6;
    --accent: #0091ae;
    --accent-soft: #eaf7f8;
    --brand: #ff7a59;
    --brand-dark: #e66e50;
    --accent-text: #ffffff;
    --danger: #e0455a;
    --danger-soft: #fdeef0;
    --radius: 4px;
    --radius-lg: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  .topnav {
    background: var(--navy); color: #fff; display: flex; align-items: center;
    gap: 20px; padding: 0 24px; height: 56px;
  }
  .topnav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; color: #fff; white-space: nowrap; }
  .topnav-brand .mark {
    width: 28px; height: 28px; border-radius: 6px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; color: #fff;
  }
  .topnav-links { display: flex; align-items: center; gap: 2px; flex: 1; }
  .topnav-links a {
    color: #cbd6e2; text-decoration: none; font-size: 0.86rem; font-weight: 500;
    padding: 8px 12px; border-radius: var(--radius); transition: background 0.15s ease, color 0.15s ease;
  }
  .topnav-links a:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
  .topnav-links a.active { color: #fff; background: rgba(255, 255, 255, 0.14); }
  .topnav-user { display: flex; align-items: center; gap: 12px; font-size: 0.82rem; color: #cbd6e2; white-space: nowrap; }
  .topnav-user .topnav-user-name { color: #fff; font-weight: 600; }
  .topnav-user a { color: #cbd6e2; text-decoration: none; }
  .topnav-user a:hover { color: #fff; }
  h1 { font-size: 1.65rem; font-weight: 500; margin: 0 0 4px; letter-spacing: -0.01em; color: var(--navy); }
  p.subtitle { color: var(--muted); margin: 0; font-size: 0.88rem; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 20px; }
  .page-head { padding-bottom: 20px; border-bottom: 1px solid var(--border-strong); margin-bottom: 4px; }
  section.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 26px;
  }
  section.card h2 { margin: 0 0 18px; font-size: 1rem; font-weight: 600; color: var(--navy); }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
  input {
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    min-width: 0;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--brand);
    color: var(--accent-text);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--brand-dark); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--navy);
    font-weight: 500;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  button.ghost:hover { background: var(--bg); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.danger:hover { background: var(--danger); color: #fff; }
  .msg { font-size: 0.85rem; margin: 0 0 10px; min-height: 1.1em; }
  .msg.error { color: var(--danger); }
  .msg.success { color: #2fa968; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { background: var(--bg); color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:hover { background: var(--accent-soft); }
  .empty { color: var(--muted); font-style: italic; }
  .row-actions { display: flex; gap: 6px; }
  .edit-row-input { width: 100%; }
  .logo-cell { display: flex; align-items: center; gap: 8px; }
  .logo-thumb { width: 32px; height: 32px; object-fit: contain; border-radius: 6px; border: 1px solid var(--border-strong); vertical-align: middle; background: var(--card); }
  .upload-label-sm {
    display: inline-block; padding: 5px 10px; font-size: 0.78rem; font-weight: 500;
    border: 1px solid var(--border-strong); border-radius: var(--radius); cursor: pointer;
    background: transparent; color: var(--navy); white-space: nowrap;
  }
  .upload-label-sm:hover { background: var(--bg); }
  /* Page-specific: the connection status line and the per-field note
     saying where the value in effect actually comes from. */
  .status-line { font-size: 0.95rem; font-weight: 600; margin: 0 0 6px; }
  .status-line.ok { color: #2fa968; }
  .status-line.off { color: var(--danger); }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
  .settings-grid .field:first-child { grid-column: 1 / -1; }
  .field-source { font-size: 0.72rem; color: var(--muted); }
  .field-source.missing { color: var(--danger); }
  .actions { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  @media (max-width: 560px) { .settings-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav-brand"><span class="mark">MS</span> מערכת קמפיינים</div>
  <nav class="topnav-links" id="topnavLinks"></nav>
  <div class="topnav-user" id="userInfo"></div>
</header>
<main>
  <div class="page-head">
    <h1>הגדרות SMS</h1>
    <p class="subtitle">פרטי החיבור לספק ה-SMS ששולח את קודי האימות בטופסי ההרשמה. ההגדרות משותפות לכל המערכת — לא לכל קמפיין בנפרד.</p>
  </div>

  <section class="card">
    <h2>מצב החיבור</h2>
    <p class="status-line" id="statusLine">טוען…</p>
    <p class="subtitle" id="statusHint"></p>
  </section>

  <section class="card">
    <h2>פרטי חיבור</h2>
    <div class="settings-grid">
      <div class="field">
        <label for="apiUrl">כתובת ה-API</label>
        <input id="apiUrl" type="url" dir="ltr" placeholder="https://…" autocomplete="off" />
        <span class="field-source" id="apiUrlSource"></span>
      </div>
      <div class="field">
        <label for="smsUser">שם משתמש</label>
        <input id="smsUser" dir="ltr" autocomplete="off" />
        <span class="field-source" id="smsUserSource"></span>
      </div>
      <div class="field">
        <label for="smsPassword">סיסמה</label>
        <input id="smsPassword" type="password" dir="ltr" autocomplete="new-password" />
        <span class="field-source" id="smsPasswordSource"></span>
      </div>
      <div class="field">
        <label for="smsSender">שם השולח</label>
        <input id="smsSender" dir="ltr" maxlength="11" placeholder="OTP" autocomplete="off" />
        <span class="field-source" id="smsSenderSource"></span>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="saveBtn">שמירה</button>
      <button type="button" class="ghost danger" id="clearPasswordBtn" hidden>מחיקת הסיסמה</button>
    </div>
    <p class="msg" id="saveMsg"></p>
    <p class="subtitle" id="updatedAt"></p>
  </section>

  <section class="card">
    <h2>בדיקת שליחה</h2>
    <p class="subtitle" style="margin-bottom:14px;">שולח הודעת בדיקה אמיתית דרך ההגדרות השמורות, כדי לוודא שהן לא רק נשמרו אלא גם עובדות. השליחה מחויבת ביחידת SMS.</p>
    <form id="testForm">
      <div class="field">
        <label for="testPhone">מספר טלפון לבדיקה</label>
        <input id="testPhone" type="tel" dir="ltr" placeholder="0XX-XXXXXXX" required />
      </div>
      <button type="submit">שלח הודעת בדיקה</button>
    </form>
    <p class="msg" id="testMsg"></p>
  </section>
</main>

<script>
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Shared across index/edit/users/brands/networks/sms-settings.html
  // (each page keeps its own copy — this app has no build step to share
  // JS across static pages). Populates the navy top bar: the nav links
  // (gated to admin-only pages the same way each page already gates
  // itself) and the logged-in user's name/role/logout link.
  const TOPNAV_LINKS = [
    { href: '/', label: 'קמפיינים', adminOnly: false },
    { href: '/users.html', label: 'משתמשים', adminOnly: true },
    { href: '/brands.html', label: 'מותגים', adminOnly: true },
    { href: '/networks.html', label: 'רשתות', adminOnly: true },
    { href: '/sms-settings.html', label: 'הגדרות SMS', adminOnly: true },
  ];
  function renderTopnav(user) {
    const navEl = document.getElementById('topnavLinks');
    if (navEl) {
      navEl.innerHTML = TOPNAV_LINKS
        .filter((l) => !l.adminOnly || user.role === 'admin')
        .map((l) => {
          const isActive = location.pathname === l.href || (l.href === '/' && location.pathname === '/index.html');
          return `<a href="${l.href}" class="${isActive ? 'active' : ''}">${l.label}</a>`;
        })
        .join('');
    }
    document.getElementById('userInfo').innerHTML = `
      <span class="topnav-user-name">${escapeHtml(user.username)}</span>
      <span>${user.role === 'admin' ? 'אדמין' : 'משתמש רגיל'}</span>
      <a href="#" id="logoutLink">התנתקות</a>
    `;
    document.getElementById('logoutLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/login.html';
    });
  }

  function showMsg(elId, text, kind) {
    const node = document.getElementById(elId);
    node.textContent = text || '';
    node.className = 'msg' + (kind ? ' ' + kind : '');
  }

  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    let data = null;
    if (res.status !== 204) data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.error) || `שגיאה (${res.status})`);
    return data;
  }

  // Where each value in effect actually comes from. A value set here
  // wins over the matching UNICELL_* environment variable, so this is
  // what tells an admin whether the box they're looking at is the live
  // value or a fallback they'd be overriding by saving.
  const SOURCE_LABELS = {
    settings: 'נשמר בעמוד זה',
    env: 'מגיע מהגדרות השרת (משתנה סביבה)',
    none: 'לא מוגדר',
  };

  function renderSettings(settings) {
    document.getElementById('apiUrl').value = settings.api_url || '';
    document.getElementById('smsUser').value = settings.user || '';
    document.getElementById('smsSender').value = settings.sender || '';
    // The password is never sent back to us — the box stays empty and
    // its placeholder says whether one is stored. Leaving it blank on
    // save keeps whatever is already there.
    const passwordInput = document.getElementById('smsPassword');
    passwordInput.value = '';
    passwordInput.placeholder = settings.has_password ? '•••• השאר ריק כדי לשמור' : 'הזן סיסמה';
    document.getElementById('clearPasswordBtn').hidden = !(settings.sources && settings.sources.password === 'settings');

    const sources = settings.sources || {};
    const setSource = (elId, key) => {
      const el = document.getElementById(elId);
      el.textContent = SOURCE_LABELS[sources[key]] || '';
      el.className = 'field-source' + (sources[key] === 'none' ? ' missing' : '');
    };
    setSource('apiUrlSource', 'api_url');
    setSource('smsUserSource', 'user');
    setSource('smsPasswordSource', 'password');
    setSource('smsSenderSource', 'sender');

    const statusEl = document.getElementById('statusLine');
    statusEl.textContent = settings.configured ? 'מחובר — ההגדרות מלאות ושליחת SMS מופעלת' : 'לא מוגדר — שליחת קודי אימות מושבתת';
    statusEl.className = 'status-line ' + (settings.configured ? 'ok' : 'off');
    document.getElementById('statusHint').textContent = settings.configured
      ? 'קמפיין שבו מופעל אימות SMS ישלח קודים דרך ההגדרות האלה.'
      : 'נדרשים כתובת API, שם משתמש וסיסמה. עד אז, קמפיין שבו מופעל אימות SMS יציג לנרשם שגיאה במקום לשלוח קוד.';

    document.getElementById('updatedAt').textContent = settings.updated_at
      ? `עודכן לאחרונה: ${new Date(settings.updated_at).toLocaleString('he-IL')}${settings.updated_by ? ' על ידי ' + settings.updated_by : ''}`
      : '';
  }

  async function loadSettings() {
    try {
      renderSettings(await api('/api/sms-settings'));
    } catch (error) {
      document.getElementById('statusLine').textContent = error.message;
      document.getElementById('statusLine').className = 'status-line off';
    }
  }

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const payload = {
      api_url: document.getElementById('apiUrl').value.trim(),
      user: document.getElementById('smsUser').value.trim(),
      sender: document.getElementById('smsSender').value.trim(),
    };
    // Only touch the password if the admin actually typed one.
    const password = document.getElementById('smsPassword').value;
    if (password) payload.password = password;
    try {
      renderSettings(await api('/api/sms-settings', { method: 'PUT', body: JSON.stringify(payload) }));
      showMsg('saveMsg', 'ההגדרות נשמרו', 'success');
    } catch (error) {
      showMsg('saveMsg', error.message, 'error');
    }
  });

  document.getElementById('clearPasswordBtn').addEventListener('click', async () => {
    if (!confirm('למחוק את הסיסמה השמורה? שליחת ה-SMS תיעצר עד שתוזן סיסמה חדשה.')) return;
    try {
      renderSettings(await api('/api/sms-settings', { method: 'PUT', body: JSON.stringify({ password: null }) }));
      showMsg('saveMsg', 'הסיסמה נמחקה', 'success');
    } catch (error) {
      showMsg('saveMsg', error.message, 'error');
    }
  });

  document.getElementById('testForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const phone = document.getElementById('testPhone').value.trim();
    showMsg('testMsg', 'שולח…');
    try {
      const result = await api('/api/sms-settings/test', { method: 'POST', body: JSON.stringify({ phone }) });
      showMsg('testMsg', `נשלחה הודעת בדיקה אל ${result.sent_to}`, 'success');
    } catch (error) {
      showMsg('testMsg', error.message, 'error');
    }
  });

  // Same idle-logout watchdog every admin page runs: re-mints the
  // session cookie while there's real activity, logs out once idle.
  function startSessionWatchdog() {
    const IDLE_TIMEOUT_MS = 10 * 60 * 1000;
    let lastActivityAt = Date.now();
    for (const evt of ['click', 'keydown', 'mousemove', 'scroll', 'touchstart']) {
      window.addEventListener(evt, () => { lastActivityAt = Date.now(); }, { passive: true });
    }
    setInterval(async () => {
      if (Date.now() - lastActivityAt >= IDLE_TIMEOUT_MS) {
        await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
        location.href = '/login.html';
        return;
      }
      const res = await fetch('/api/auth/refresh', { method: 'POST' });
      if (!res.ok) location.href = '/login.html';
    }, 30 * 1000);
  }

  (async () => {
    try {
      const me = await api('/api/auth/me');
      if (me.role !== 'admin') {
        location.href = '/';
        return;
      }
      renderTopnav(me);
      await loadSettings();
      startSessionWatchdog();
    } catch {
      location.href = '/login.html';
    }
  })();
</script>
</body>
</html>
