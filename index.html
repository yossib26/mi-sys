<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ניהול קמפיינים</title>
<style>
  :root {
    --bg: #fbfbfc;
    --card: #ffffff;
    --border: #f0f1f4;
    --border-strong: #e6e7eb;
    --text: #2c2e33;
    --muted: #9a9ea8;
    --accent: #4361ee;
    --accent-soft: #f0f3ff;
    --accent-text: #ffffff;
    --danger: #e0455a;
    --danger-soft: #fdeef0;
    --radius: 16px;
  }
  /* Always light — not tied to the OS/browser color scheme. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 1.45rem; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.subtitle { color: var(--muted); margin: 0 0 28px; font-size: 0.9rem; }
  main { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  section.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 26px;
  }
  section.card h2 { margin: 0 0 18px; font-size: 1rem; font-weight: 600; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
  input, select, textarea {
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    min-width: 0;
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    transition: filter 0.15s ease, background 0.15s ease;
  }
  button:hover { filter: brightness(1.06); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-weight: 500;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  button.ghost:hover { background: var(--bg); filter: none; }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.danger:hover { filter: none; background: var(--danger); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: right; padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th {
    color: var(--muted); font-weight: 600; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  th[data-sort] { cursor: pointer; -webkit-user-select: none; user-select: none; white-space: nowrap; }
  th[data-sort]:hover { color: var(--text); }
  th[data-sort] .arrow { display: inline-block; width: 1em; opacity: 0.7; }
  .pagination { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 18px; font-size: 0.85rem; color: var(--muted); }
  .pagination button {
    padding: 6px 14px; font-size: 0.85rem; font-weight: 500; background: transparent;
    border: 1px solid var(--border-strong); color: var(--text);
  }
  .pagination button:hover { background: var(--bg); }
  .pagination button:disabled { opacity: 0.4; cursor: default; background: none; }
  .page-size-label { display: flex; align-items: center; gap: 6px; }
  .page-size-label select {
    padding: 5px 8px; font-size: 0.85rem; border-radius: 8px;
    border: 1px solid var(--border-strong); background: var(--card); color: var(--text);
  }
  tbody tr { transition: background 0.1s ease; }
  tbody tr:hover { background: var(--accent-soft); }
  .empty { color: var(--muted); font-style: italic; padding: 14px 0; }
  .badge {
    display: inline-block;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge-draft { background: #f1f2f4; color: #6b7280; }
  .badge-active { background: #e6f7ee; color: #1a8f52; }
  .badge-paused { background: #fdf3df; color: #b3760f; }
  .badge-completed { background: #eaf0ff; color: #3151d3; }
  .badge-cancelled { background: #fdeef0; color: #c72e42; }
  .badge-archived { background: #f1f2f4; color: #6b7280; }
  .status-select { font-size: 0.82rem; }
  .row-actions { display: flex; gap: 6px; align-items: center; }
  .row-actions a {
    display: inline-block; padding: 6px 12px; font-size: 0.85rem; font-weight: 500;
    border: 1px solid var(--border-strong); border-radius: 10px;
    color: var(--text); text-decoration: none; transition: background 0.15s ease;
  }
  .row-actions a:hover { background: var(--bg); }
  .msg { font-size: 0.85rem; margin: 0 0 10px; min-height: 1.1em; }
  .msg.error { color: var(--danger); }
  .table-wrap { overflow-x: auto; }
  .list { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border-strong); border-radius: 999px;
    background: var(--bg);
    padding: 6px 6px 6px 14px; font-size: 0.85rem;
  }
  .chip button { padding: 3px 10px; font-size: 0.75rem; }
  .field-wide { flex: 1 1 200px; }
  .filter-field { margin-bottom: 14px; max-width: 240px; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); }
  .user-info a { color: var(--text); text-decoration: none; border: 1px solid var(--border-strong); border-radius: 10px; padding: 6px 12px; }
  .user-info a:hover { background: var(--bg); }
</style>
</head>
<body>
<main>
  <div class="top-bar">
    <div>
      <h1>ניהול קמפיינים למותגים</h1>
      <p class="subtitle">מחובר ל-Neon PostgreSQL · <span id="dbStatus">בודק חיבור…</span></p>
    </div>
    <div class="user-info" id="userInfo"></div>
  </div>

  <section class="card" id="brandsSection">
    <h2>מותגים</h2>
    <p class="msg" id="brandMsg"></p>
    <form id="brandForm">
      <div class="field">
        <label for="brandName">שם מותג</label>
        <input id="brandName" name="name" required placeholder="לדוגמה: Nike" />
      </div>
      <button type="submit">הוסף מותג</button>
    </form>
    <div class="list" id="brandList"><p class="empty">טוען…</p></div>
  </section>

  <section class="card">
    <h2>קמפיינים</h2>
    <p class="msg" id="campaignMsg"></p>
    <form id="campaignForm">
      <div class="field">
        <label for="campaignBrand">מותג</label>
        <select id="campaignBrand" name="brand_id" required></select>
      </div>
      <div class="field">
        <label for="campaignName">שם קמפיין</label>
        <input id="campaignName" name="name" required placeholder="לדוגמה: מבצע קיץ" />
      </div>
      <div class="field">
        <label for="campaignBudget">תקציב</label>
        <input id="campaignBudget" name="budget" type="number" step="0.01" min="0" placeholder="0" />
      </div>
      <div class="field">
        <label for="campaignStart">תאריך התחלה</label>
        <input id="campaignStart" name="start_date" type="date" />
      </div>
      <div class="field">
        <label for="campaignEnd">תאריך סיום</label>
        <input id="campaignEnd" name="end_date" type="date" />
      </div>
      <div class="field field-wide">
        <label for="campaignDescription">תיאור</label>
        <input id="campaignDescription" name="description" placeholder="אופציונלי" />
      </div>
      <button type="submit">הוסף קמפיין</button>
    </form>

    <div class="field filter-field">
      <label for="filterBrand">סינון לפי מותג</label>
      <select id="filterBrand">
        <option value="">כל המותגים</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr id="campaignHeaderRow">
            <th data-sort="brand_name">מותג</th>
            <th data-sort="name">שם</th>
            <th>תיאור</th>
            <th data-sort="budget">תקציב</th>
            <th data-sort="start_date">התחלה</th>
            <th data-sort="end_date">סיום</th>
            <th data-sort="status">סטטוס</th>
            <th>קישור</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody id="campaignRows">
          <tr><td colspan="9" class="empty">טוען…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </section>
</main>

<script>
  const STATUSES = ['draft', 'active', 'paused', 'completed', 'cancelled', 'archived'];
  const STATUS_LABELS = {
    draft: 'טיוטה',
    active: 'פעיל',
    paused: 'מושהה',
    completed: 'הושלם',
    cancelled: 'בוטל',
    archived: 'בארכיון',
  };

  let brandsCache = [];
  let currentUser = null;

  async function initAuth() {
    const res = await fetch('/api/auth/me');
    if (!res.ok) {
      location.href = '/login.html';
      return false;
    }
    currentUser = await res.json();
    document.getElementById('userInfo').innerHTML = `
      <span>${escapeHtml(currentUser.username)} · ${currentUser.role === 'admin' ? 'אדמין' : 'משתמש רגיל'}</span>
      ${currentUser.role === 'admin' ? '<a href="/users.html">ניהול משתמשים</a>' : ''}
      <a href="#" id="logoutLink">התנתקות</a>
    `;
    document.getElementById('logoutLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/login.html';
    });
    // Brand management (add/delete) is admin-only; regular users still
    // get the brand dropdown when creating/editing a campaign.
    if (currentUser.role !== 'admin') {
      document.getElementById('brandsSection').style.display = 'none';
    }
    return true;
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function showMsg(id, text, isError) {
    const node = document.getElementById(id);
    node.textContent = text || '';
    node.className = 'msg' + (isError ? ' error' : '');
  }

  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    let data = null;
    if (res.status !== 204) {
      data = await res.json().catch(() => null);
    }
    if (!res.ok) {
      throw new Error((data && data.error) || `שגיאה (${res.status})`);
    }
    return data;
  }

  async function checkStatus() {
    const el = document.getElementById('dbStatus');
    try {
      await api('/api/status');
      el.textContent = 'מחובר ✅';
    } catch (error) {
      el.textContent = 'לא מחובר ❌ (' + error.message + ')';
    }
  }

  async function loadBrands() {
    const listEl = document.getElementById('brandList');
    try {
      brandsCache = await api('/api/brands');
    } catch (error) {
      listEl.innerHTML = '';
      showMsg('brandMsg', error.message, true);
      return;
    }

    listEl.innerHTML = brandsCache.length
      ? brandsCache.map((b) => `
        <span class="chip">
          ${escapeHtml(b.name)}
          <button class="ghost danger" data-delete-brand="${b.id}">מחק</button>
        </span>
      `).join('')
      : '<p class="empty">אין עדיין מותגים.</p>';

    const brandSelect = document.getElementById('campaignBrand');
    const filterSelect = document.getElementById('filterBrand');
    const prevFilter = filterSelect.value;

    brandSelect.innerHTML = brandsCache
      .map((b) => `<option value="${b.id}">${escapeHtml(b.name)}</option>`)
      .join('') || '<option value="">אין מותגים</option>';

    filterSelect.innerHTML = '<option value="">כל המותגים</option>' +
      brandsCache.map((b) => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('');
    filterSelect.value = prevFilter;
  }

  function formatDate(value) {
    return value || '-';
  }

  function formatBudget(value) {
    if (value === null || value === undefined) return '-';
    return Number(value).toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  const PAGE_SIZE_OPTIONS = [10, 19, 25, 50, 100];
  const sortState = { sort: 'created_at', order: 'desc' };
  let currentPage = 1;
  let pageSize = 19;

  function renderSortArrows() {
    document.querySelectorAll('#campaignHeaderRow th[data-sort]').forEach((th) => {
      th.querySelectorAll('.arrow').forEach((el) => el.remove());
      if (th.getAttribute('data-sort') === sortState.sort) {
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = sortState.order === 'asc' ? '▲' : '▼';
        th.appendChild(document.createTextNode(' '));
        th.appendChild(arrow);
      }
    });
  }

  function renderPagination(meta) {
    const el = document.getElementById('pagination');
    if (meta.total === 0) {
      el.innerHTML = '';
      return;
    }
    el.innerHTML = `
      <button id="prevPage" ${meta.page <= 1 ? 'disabled' : ''}>‹ הקודם</button>
      <span>עמוד ${meta.page} מתוך ${meta.totalPages} (${meta.total} קמפיינים)</span>
      <button id="nextPage" ${meta.page >= meta.totalPages ? 'disabled' : ''}>הבא ›</button>
      <label class="page-size-label">
        רשומות בעמוד:
        <select id="pageSizeSelect">
          ${PAGE_SIZE_OPTIONS.map((n) => `<option value="${n}" ${n === pageSize ? 'selected' : ''}>${n}</option>`).join('')}
        </select>
      </label>
    `;
    document.getElementById('prevPage')?.addEventListener('click', () => {
      currentPage = Math.max(1, currentPage - 1);
      loadCampaigns();
    });
    document.getElementById('nextPage')?.addEventListener('click', () => {
      currentPage = Math.min(meta.totalPages, currentPage + 1);
      loadCampaigns();
    });
    document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
      pageSize = Number(e.target.value);
      currentPage = 1;
      loadCampaigns();
    });
  }

  async function loadCampaigns() {
    const rowsEl = document.getElementById('campaignRows');
    const brandId = document.getElementById('filterBrand').value;
    const params = new URLSearchParams({
      sort: sortState.sort,
      order: sortState.order,
      page: currentPage,
      pageSize,
    });
    if (brandId) params.set('brand_id', brandId);

    let result;
    try {
      result = await api('/api/campaigns?' + params.toString());
    } catch (error) {
      rowsEl.innerHTML = `<tr><td colspan="9" class="empty">${escapeHtml(error.message)}</td></tr>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    if (result.total > 0 && currentPage > result.totalPages) {
      currentPage = result.totalPages;
      return loadCampaigns();
    }

    renderSortArrows();
    renderPagination(result);
    const campaigns = result.rows;

    if (campaigns.length === 0) {
      rowsEl.innerHTML = '<tr><td colspan="9" class="empty">אין עדיין קמפיינים.</td></tr>';
      return;
    }

    rowsEl.innerHTML = campaigns.map((c) => `
      <tr>
        <td>${escapeHtml(c.brand_name)}</td>
        <td>${escapeHtml(c.name)}</td>
        <td>${escapeHtml(c.description) || '-'}</td>
        <td>${formatBudget(c.budget)}</td>
        <td>${formatDate(c.start_date)}</td>
        <td>${formatDate(c.end_date)}</td>
        <td>
          <select class="status-select" data-status-for="${c.id}">
            ${STATUSES.map((s) => `<option value="${s}" ${s === c.status ? 'selected' : ''} ${s === 'archived' && (!currentUser || currentUser.role !== 'admin') ? 'disabled' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
          </select>
        </td>
        <td>
          ${c.slug && c.brand_slug ? `
            <a href="/c/${encodeURIComponent(c.brand_slug)}/${encodeURIComponent(c.slug)}" target="_blank" rel="noopener">פתח ↗</a>
            <button class="ghost" data-copy-brand="${escapeHtml(c.brand_slug)}" data-copy-campaign="${escapeHtml(c.slug)}">העתק</button>
          ` : '-'}
        </td>
        <td class="row-actions">
          <a href="/edit.html?id=${c.id}">ערוך</a>
          ${c.status !== 'archived' && currentUser && currentUser.role === 'admin' ? `<button class="ghost danger" data-delete-campaign="${c.id}">ארכב</button>` : ''}
        </td>
      </tr>
    `).join('');
  }

  document.getElementById('brandForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('brandName').value.trim();
    if (!name) return;
    try {
      await api('/api/brands', { method: 'POST', body: JSON.stringify({ name }) });
      document.getElementById('brandName').value = '';
      showMsg('brandMsg', '');
      await loadBrands();
    } catch (error) {
      showMsg('brandMsg', error.message, true);
    }
  });

  document.getElementById('brandList').addEventListener('click', async (e) => {
    const id = e.target.getAttribute('data-delete-brand');
    if (!id) return;
    if (!confirm('למחוק את המותג? כל הקמפיינים שלו יימחקו גם הם.')) return;
    try {
      await api(`/api/brands/${id}`, { method: 'DELETE' });
      await Promise.all([loadBrands(), loadCampaigns()]);
    } catch (error) {
      showMsg('brandMsg', error.message, true);
    }
  });

  document.getElementById('campaignForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const payload = {
      brand_id: Number(form.brand_id.value),
      name: form.name.value.trim(),
      description: form.description.value.trim() || null,
      budget: form.budget.value ? Number(form.budget.value) : null,
      start_date: form.start_date.value || null,
      end_date: form.end_date.value || null,
    };
    if (!payload.brand_id || !payload.name) {
      showMsg('campaignMsg', 'יש לבחור מותג ולמלא שם קמפיין', true);
      return;
    }
    try {
      await api('/api/campaigns', { method: 'POST', body: JSON.stringify(payload) });
      form.reset();
      showMsg('campaignMsg', '');
      currentPage = 1;
      await loadCampaigns();
    } catch (error) {
      showMsg('campaignMsg', error.message, true);
    }
  });

  document.getElementById('campaignRows').addEventListener('change', async (e) => {
    const statusId = e.target.getAttribute('data-status-for');
    if (!statusId) return;
    try {
      await api(`/api/campaigns/${statusId}`, { method: 'PUT', body: JSON.stringify({ status: e.target.value }) });
      showMsg('campaignMsg', '');
    } catch (error) {
      showMsg('campaignMsg', error.message, true);
      await loadCampaigns();
    }
  });

  document.getElementById('campaignRows').addEventListener('click', async (e) => {
    const brandSlug = e.target.getAttribute('data-copy-brand');
    const campaignSlug = e.target.getAttribute('data-copy-campaign');
    if (brandSlug && campaignSlug) {
      const url = `${location.origin}/c/${encodeURIComponent(brandSlug)}/${encodeURIComponent(campaignSlug)}`;
      try {
        await navigator.clipboard.writeText(url);
        const original = e.target.textContent;
        e.target.textContent = 'הועתק!';
        setTimeout(() => { e.target.textContent = original; }, 1500);
      } catch {
        prompt('העתק את הקישור:', url);
      }
      return;
    }

    const id = e.target.getAttribute('data-delete-campaign');
    if (!id) return;
    const typed = prompt('הקמפיין לא יימחק — הוא יועבר לארכיון. להמשך, הקלד/י DELETE:');
    if (typed !== 'DELETE') return;
    try {
      await api(`/api/campaigns/${id}`, { method: 'DELETE' });
      await loadCampaigns();
    } catch (error) {
      showMsg('campaignMsg', error.message, true);
    }
  });

  document.getElementById('filterBrand').addEventListener('change', () => {
    currentPage = 1;
    loadCampaigns();
  });

  document.getElementById('campaignHeaderRow').addEventListener('click', (e) => {
    const th = e.target.closest('th[data-sort]');
    if (!th) return;
    const field = th.getAttribute('data-sort');
    if (sortState.sort === field) {
      sortState.order = sortState.order === 'asc' ? 'desc' : 'asc';
    } else {
      sortState.sort = field;
      sortState.order = 'asc';
    }
    currentPage = 1;
    loadCampaigns();
  });

  initAuth().then((ok) => {
    if (!ok) return;
    checkStatus();
    loadBrands().then(loadCampaigns);
  });
</script>
</body>
</html>
