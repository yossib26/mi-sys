<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ניהול קמפיינים</title>
<style>
  :root {
    --navy: #33475b;
    --bg: #f5f8fa;
    --card: #ffffff;
    --border: #e5e8ec;
    --border-strong: #cbd6e2;
    --text: #33475b;
    --muted: #7c98b6;
    --accent: #0091ae;
    --accent-soft: #eaf7f8;
    --brand: #ff7a59;
    --brand-dark: #e66e50;
    --accent-text: #ffffff;
    --danger: #e0455a;
    --danger-soft: #fdeef0;
    --radius: 4px;
    --radius-lg: 8px;
  }
  /* Always light — not tied to the OS/browser color scheme. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .topnav {
    background: var(--navy); color: #fff; display: flex; align-items: center;
    gap: 20px; padding: 0 24px; height: 56px;
  }
  .topnav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; color: #fff; white-space: nowrap; }
  .topnav-brand .mark {
    width: 28px; height: 28px; border-radius: 6px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; color: #fff;
  }
  .topnav-links { display: flex; align-items: center; gap: 2px; flex: 1; }
  .topnav-links a {
    color: #cbd6e2; text-decoration: none; font-size: 0.86rem; font-weight: 500;
    padding: 8px 12px; border-radius: var(--radius); transition: background 0.15s ease, color 0.15s ease;
  }
  .topnav-links a:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
  .topnav-links a.active { color: #fff; background: rgba(255, 255, 255, 0.14); }
  .topnav-user { display: flex; align-items: center; gap: 12px; font-size: 0.82rem; color: #cbd6e2; white-space: nowrap; }
  .topnav-user .topnav-user-name { color: #fff; font-weight: 600; }
  .topnav-user a { color: #cbd6e2; text-decoration: none; }
  .topnav-user a:hover { color: #fff; }
  h1 { font-size: 1.65rem; font-weight: 500; margin: 0 0 4px; letter-spacing: -0.01em; color: var(--navy); }
  p.subtitle { color: var(--muted); margin: 0; font-size: 0.88rem; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 20px; }
  .page-head { padding-bottom: 20px; border-bottom: 1px solid var(--border-strong); margin-bottom: 4px; }
  section.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 26px;
  }
  section.card h2 { margin: 0 0 18px; font-size: 1rem; font-weight: 600; color: var(--navy); }
  .section-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
  .section-header h2 { margin: 0; }
  form#campaignForm .actions { display: flex; gap: 8px; align-items: center; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 18px; }
  form[hidden] { display: none; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
  input, select, textarea {
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    min-width: 0;
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--brand);
    color: var(--accent-text);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--brand-dark); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--navy);
    font-weight: 500;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  button.ghost:hover { background: var(--bg); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.danger:hover { background: var(--danger); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: right; padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th {
    background: var(--bg); color: var(--muted); font-weight: 600; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  th[data-sort] { cursor: pointer; -webkit-user-select: none; user-select: none; white-space: nowrap; }
  th[data-sort]:hover { color: var(--navy); }
  th[data-sort] .arrow { display: inline-block; width: 1em; opacity: 0.7; }
  .pagination { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 18px; font-size: 0.85rem; color: var(--muted); }
  .pagination button {
    padding: 6px 14px; font-size: 0.85rem; font-weight: 500; background: var(--card);
    border: 1px solid var(--border-strong); color: var(--navy); border-radius: var(--radius);
  }
  .pagination button:hover:not(:disabled) { background: var(--bg); }
  .pagination button:disabled { opacity: 0.4; cursor: default; background: none; }
  .page-size-label { display: flex; align-items: center; gap: 6px; }
  .page-size-label select {
    padding: 5px 8px; font-size: 0.85rem; border-radius: var(--radius);
    border: 1px solid var(--border-strong); background: var(--card); color: var(--text);
  }
  tbody tr { transition: background 0.1s ease; }
  tbody tr:hover { background: var(--accent-soft); }
  .empty { color: var(--muted); font-style: italic; padding: 14px 0; }
  .badge {
    display: inline-block;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge-draft { background: #f1f2f4; color: #6b7280; }
  .badge-active { background: #e6f7ee; color: #1a8f52; }
  .badge-paused { background: #fdf3df; color: #b3760f; }
  .badge-completed { background: #eaf0ff; color: #3151d3; }
  .badge-cancelled { background: #fdeef0; color: #c72e42; }
  .badge-archived { background: #f1f2f4; color: #6b7280; }
  .status-select { font-size: 0.82rem; }
  .row-actions { display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0;
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    background: transparent; color: var(--navy); text-decoration: none;
    cursor: pointer; transition: background 0.15s ease;
  }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn.danger { color: var(--danger); }
  .icon-btn.danger:hover { background: var(--danger-soft); }
  .icon-btn:disabled { opacity: 0.5; cursor: default; }
  .msg { font-size: 0.85rem; margin: 0 0 10px; min-height: 1.1em; }
  .msg.error { color: var(--danger); }
  .table-wrap { overflow-x: auto; }
  .field-wide { flex: 1 1 200px; }
  .filter-field { margin-bottom: 14px; max-width: 240px; }
  .select-col { width: 32px; }
  .select-col input, .select-campaign-checkbox { width: 16px; height: 16px; cursor: pointer; margin: 0; }
  .bulk-toolbar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    padding: 10px 14px; background: var(--accent-soft); border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg); font-size: 0.85rem; color: var(--navy);
  }
  .bulk-toolbar[hidden] { display: none; }
  .bulk-toolbar button { margin-inline-start: auto; }
  .filter-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .avatar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; color: #fff;
    font-size: 0.72rem; font-weight: 700; margin-inline-end: 8px; flex: none; vertical-align: middle;
  }
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav-brand"><span class="mark">MS</span> מערכת קמפיינים</div>
  <nav class="topnav-links" id="topnavLinks"></nav>
  <div class="topnav-user" id="userInfo"></div>
</header>
<main>
  <div class="page-head">
    <h1>ניהול קמפיינים למותגים</h1>
    <p class="subtitle">מחובר ל-Neon PostgreSQL · <span id="dbStatus">בודק חיבור…</span></p>
  </div>

  <section class="card">
    <div class="section-header">
      <h2>קמפיינים</h2>
      <button type="button" id="toggleCampaignFormBtn">+ צור קמפיין</button>
    </div>
    <p class="msg" id="campaignMsg"></p>
    <form id="campaignForm" hidden>
      <div class="field">
        <label for="campaignBrand">מותג</label>
        <select id="campaignBrand" name="brand_id" required></select>
      </div>
      <div class="field">
        <label for="campaignName">שם קמפיין</label>
        <input id="campaignName" name="name" required placeholder="לדוגמה: מבצע קיץ" />
      </div>
      <div class="field field-wide">
        <label for="campaignDescription">תיאור</label>
        <input id="campaignDescription" name="description" placeholder="אופציונלי" />
      </div>
      <div class="actions">
        <button type="submit">הוסף קמפיין</button>
        <button type="button" class="ghost" id="cancelCampaignFormBtn">ביטול</button>
      </div>
    </form>

    <div class="filter-row">
      <div class="field filter-field">
        <label for="filterBrand">סינון לפי מותג</label>
        <select id="filterBrand">
          <option value="">כל המותגים</option>
        </select>
      </div>
      <div class="field filter-field">
        <label for="filterStatus">סינון לפי סטטוס</label>
        <select id="filterStatus">
          <option value="">כל הסטטוסים</option>
          <option value="draft">טיוטה</option>
          <option value="active" selected>פעיל</option>
          <option value="paused">מושהה</option>
          <option value="completed">הושלם</option>
          <option value="cancelled">בוטל</option>
          <option value="archived" id="filterStatusArchivedOption">בארכיון</option>
        </select>
      </div>
    </div>

    <div class="bulk-toolbar" id="bulkToolbar" hidden>
      <span id="bulkSelectedCount"></span>
      <button type="button" class="danger" id="bulkDeleteBtn">העבר לארכיון את הנבחרים</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr id="campaignHeaderRow">
            <th class="select-col" id="selectAllHeaderCell"><input type="checkbox" id="selectAllCampaigns" title="בחר הכל" /></th>
            <th data-sort="brand_name">מותג</th>
            <th data-sort="name">שם</th>
            <th data-sort="status">סטטוס</th>
            <th data-sort="views_count">צפיות</th>
            <th data-sort="form_starts_count">התחילו למלא</th>
            <th data-sort="registrations_count">השלימו</th>
            <th>קישור</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody id="campaignRows">
          <tr><td colspan="10" class="empty">טוען…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </section>
</main>

<script>
  const STATUSES = ['draft', 'active', 'paused', 'completed', 'cancelled', 'archived'];
  const STATUS_LABELS = {
    draft: 'טיוטה',
    active: 'פעיל',
    paused: 'מושהה',
    completed: 'הושלם',
    cancelled: 'בוטל',
    archived: 'בארכיון',
  };

  let brandsCache = [];
  let currentUser = null;

  const ICON_EDIT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const ICON_DUPLICATE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const ICON_ARCHIVE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8"/><path d="M10 13h4"/></svg>';
  const ICON_PREVIEW = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const ICON_DASHBOARD = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>';

  // Shared across index/edit/users/brands.html (each page keeps its own
  // copy — this app has no build step to share JS across static pages).
  // Populates the navy top bar: the nav links (gated to admin-only
  // pages the same way each page already gates itself) and the
  // logged-in user's name/role/logout link.
  const TOPNAV_LINKS = [
    { href: '/', label: 'קמפיינים', adminOnly: false },
    { href: '/users.html', label: 'משתמשים', adminOnly: true },
    { href: '/brands.html', label: 'מותגים', adminOnly: true },
    { href: '/networks.html', label: 'רשתות', adminOnly: true },
  ];
  const AVATAR_COLORS = ['#0091ae', '#33475b', '#ff7a59', '#00a4bd', '#7c98b6', '#516f90'];
  function avatarColor(str) {
    let h = 0;
    for (let i = 0; i < String(str).length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function avatarHtml(name) {
    const initial = (name || '?').trim().charAt(0).toUpperCase() || '?';
    return `<span class="avatar" style="background:${avatarColor(name || '')}">${escapeHtml(initial)}</span>`;
  }
  function renderTopnav(user) {
    const navEl = document.getElementById('topnavLinks');
    if (navEl) {
      navEl.innerHTML = TOPNAV_LINKS
        .filter((l) => !l.adminOnly || user.role === 'admin')
        .map((l) => {
          const isActive = location.pathname === l.href || (l.href === '/' && location.pathname === '/index.html');
          return `<a href="${l.href}" class="${isActive ? 'active' : ''}">${l.label}</a>`;
        })
        .join('');
    }
    document.getElementById('userInfo').innerHTML = `
      <span class="topnav-user-name">${escapeHtml(user.username)}</span>
      <span>${user.role === 'admin' ? 'אדמין' : 'משתמש רגיל'}</span>
      <a href="#" id="logoutLink">התנתקות</a>
    `;
    document.getElementById('logoutLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/login.html';
    });
  }

  async function initAuth() {
    const res = await fetch('/api/auth/me');
    if (!res.ok) {
      location.href = '/login.html';
      return false;
    }
    currentUser = await res.json();
    renderTopnav(currentUser);
    if (currentUser.role !== 'admin') {
      document.getElementById('filterStatusArchivedOption').remove();
      document.getElementById('selectAllHeaderCell').remove();
    }
    startSessionWatchdog();
    return true;
  }

  function colCount() {
    return currentUser && currentUser.role === 'admin' ? 9 : 8;
  }

  // Bulk-select state for the admin-only "archive selected" action —
  // deliberately page-local: cleared on every loadCampaigns() (new
  // page/filter/sort/status-change) rather than persisted across
  // pages, so "select all" only ever means "everything on screen".
  let selectedCampaignIds = new Set();

  function updateBulkToolbar() {
    const toolbar = document.getElementById('bulkToolbar');
    if (selectedCampaignIds.size === 0) {
      toolbar.hidden = true;
      return;
    }
    toolbar.hidden = false;
    document.getElementById('bulkSelectedCount').textContent = `${selectedCampaignIds.size} קמפיינים נבחרו`;
  }

  function syncSelectAllCheckbox() {
    const selectAll = document.getElementById('selectAllCampaigns');
    if (!selectAll) return;
    const rowCheckboxes = [...document.querySelectorAll('#campaignRows [data-select-campaign]')];
    const checkedCount = rowCheckboxes.filter((cb) => cb.checked).length;
    selectAll.checked = rowCheckboxes.length > 0 && checkedCount === rowCheckboxes.length;
    selectAll.indeterminate = checkedCount > 0 && checkedCount < rowCheckboxes.length;
  }

  // Session now uses an IDLE timeout (10 minutes, see SESSION_TTL_MS
  // in lib/auth.js), not a fixed lifetime from login: any real
  // activity on this page (mouse/keyboard/scroll/click) keeps the
  // session alive by re-minting the cookie via POST /api/auth/refresh
  // roughly every 30s; once idle that long, it logs out and sends the
  // admin back to the login screen proactively, not just on their
  // next click.
  const IDLE_TIMEOUT_MS = 10 * 60 * 1000;
  let lastActivityAt = Date.now();
  ['mousedown', 'mousemove', 'keydown', 'scroll', 'click', 'touchstart'].forEach((evt) => {
    document.addEventListener(evt, () => { lastActivityAt = Date.now(); }, { passive: true });
  });

  function startSessionWatchdog() {
    setInterval(async () => {
      if (Date.now() - lastActivityAt >= IDLE_TIMEOUT_MS) {
        await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
        location.href = '/login.html';
        return;
      }
      const res = await fetch('/api/auth/refresh', { method: 'POST' });
      if (!res.ok) location.href = '/login.html';
    }, 30 * 1000);
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function showMsg(id, text, isError) {
    const node = document.getElementById(id);
    node.textContent = text || '';
    node.className = 'msg' + (isError ? ' error' : '');
  }

  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    let data = null;
    if (res.status !== 204) {
      data = await res.json().catch(() => null);
    }
    if (!res.ok) {
      throw new Error((data && data.error) || `שגיאה (${res.status})`);
    }
    return data;
  }

  async function checkStatus() {
    const el = document.getElementById('dbStatus');
    try {
      await api('/api/status');
      el.textContent = 'מחובר ✅';
    } catch (error) {
      el.textContent = 'לא מחובר ❌ (' + error.message + ')';
    }
  }

  async function loadBrands() {
    try {
      brandsCache = await api('/api/brands');
    } catch (error) {
      showMsg('campaignMsg', error.message, true);
      return;
    }

    const brandSelect = document.getElementById('campaignBrand');
    const filterSelect = document.getElementById('filterBrand');
    const prevFilter = filterSelect.value;

    brandSelect.innerHTML = brandsCache
      .map((b) => `<option value="${b.id}">${escapeHtml(b.name)}</option>`)
      .join('') || '<option value="">אין מותגים</option>';

    filterSelect.innerHTML = '<option value="">כל המותגים</option>' +
      brandsCache.map((b) => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('');
    filterSelect.value = prevFilter;
  }

  const PAGE_SIZE_OPTIONS = [10, 19, 25, 50, 100];
  const sortState = { sort: 'created_at', order: 'desc' };
  let currentPage = 1;
  let pageSize = 19;

  function renderSortArrows() {
    document.querySelectorAll('#campaignHeaderRow th[data-sort]').forEach((th) => {
      th.querySelectorAll('.arrow').forEach((el) => el.remove());
      if (th.getAttribute('data-sort') === sortState.sort) {
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = sortState.order === 'asc' ? '▲' : '▼';
        th.appendChild(document.createTextNode(' '));
        th.appendChild(arrow);
      }
    });
  }

  function renderPagination(meta) {
    const el = document.getElementById('pagination');
    if (meta.total === 0) {
      el.innerHTML = '';
      return;
    }
    el.innerHTML = `
      <button id="prevPage" ${meta.page <= 1 ? 'disabled' : ''}>‹ הקודם</button>
      <span>עמוד ${meta.page} מתוך ${meta.totalPages} (${meta.total} קמפיינים)</span>
      <button id="nextPage" ${meta.page >= meta.totalPages ? 'disabled' : ''}>הבא ›</button>
      <label class="page-size-label">
        רשומות בעמוד:
        <select id="pageSizeSelect">
          ${PAGE_SIZE_OPTIONS.map((n) => `<option value="${n}" ${n === pageSize ? 'selected' : ''}>${n}</option>`).join('')}
        </select>
      </label>
    `;
    document.getElementById('prevPage')?.addEventListener('click', () => {
      currentPage = Math.max(1, currentPage - 1);
      loadCampaigns();
    });
    document.getElementById('nextPage')?.addEventListener('click', () => {
      currentPage = Math.min(meta.totalPages, currentPage + 1);
      loadCampaigns();
    });
    document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
      pageSize = Number(e.target.value);
      currentPage = 1;
      loadCampaigns();
    });
  }

  async function loadCampaigns() {
    const rowsEl = document.getElementById('campaignRows');
    const brandId = document.getElementById('filterBrand').value;
    const status = document.getElementById('filterStatus').value;
    const params = new URLSearchParams({
      sort: sortState.sort,
      order: sortState.order,
      page: currentPage,
      pageSize,
    });
    if (brandId) params.set('brand_id', brandId);
    if (status) params.set('status', status);

    // A fresh load always means a different/reordered set of rows on
    // screen, so any previous bulk selection is stale — clear it
    // rather than risk archiving a row the admin can no longer see.
    selectedCampaignIds.clear();
    updateBulkToolbar();

    let result;
    try {
      result = await api('/api/campaigns?' + params.toString());
    } catch (error) {
      rowsEl.innerHTML = `<tr><td colspan="${colCount()}" class="empty">${escapeHtml(error.message)}</td></tr>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    if (result.total > 0 && currentPage > result.totalPages) {
      currentPage = result.totalPages;
      return loadCampaigns();
    }

    renderSortArrows();
    renderPagination(result);
    const campaigns = result.rows;

    if (campaigns.length === 0) {
      rowsEl.innerHTML = `<tr><td colspan="${colCount()}" class="empty">אין עדיין קמפיינים.</td></tr>`;
      return;
    }

    const isAdmin = currentUser && currentUser.role === 'admin';
    rowsEl.innerHTML = campaigns.map((c) => `
      <tr>
        ${isAdmin ? `<td class="select-col">${c.status !== 'archived' ? `<input type="checkbox" class="select-campaign-checkbox" data-select-campaign="${c.id}" />` : ''}</td>` : ''}
        <td>${escapeHtml(c.brand_name)}</td>
        <td>${avatarHtml(c.name)}${escapeHtml(c.name)}</td>
        <td>
          <select class="status-select" data-status-for="${c.id}">
            ${STATUSES.map((s) => `<option value="${s}" ${s === c.status ? 'selected' : ''} ${s === 'archived' && (!currentUser || currentUser.role !== 'admin') ? 'disabled' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
          </select>
        </td>
        <td>${c.views_count ?? 0}</td>
        <td>${c.form_starts_count ?? 0}</td>
        <td>${c.registrations_count ?? 0}</td>
        <td>
          ${c.slug && c.brand_slug ? `
            <a class="icon-btn" href="/c/${encodeURIComponent(c.brand_slug)}/${encodeURIComponent(c.slug)}" target="_blank" rel="noopener" title="תצוגה מקדימה">${ICON_PREVIEW}</a>
          ` : '-'}
        </td>
        <td>
          <div class="row-actions">
            <a class="icon-btn" href="/dashboard.html?id=${c.id}" title="לוח בקרה">${ICON_DASHBOARD}</a>
            <a class="icon-btn" href="/edit.html?id=${c.id}" title="ערוך">${ICON_EDIT}</a>
            <button class="icon-btn" data-duplicate-campaign="${c.id}" title="שכפל">${ICON_DUPLICATE}</button>
            ${c.status !== 'archived' && currentUser && currentUser.role === 'admin' ? `<button class="icon-btn danger" data-delete-campaign="${c.id}" title="ארכב">${ICON_ARCHIVE}</button>` : ''}
          </div>
        </td>
      </tr>
    `).join('');
    syncSelectAllCheckbox();
  }

  // The "create campaign" fields are hidden by default and only shown
  // on demand — "+ צור קמפיין" reveals the form, "ביטול" or a
  // successful save collapses it again.
  function showCampaignForm() {
    document.getElementById('campaignForm').hidden = false;
    document.getElementById('toggleCampaignFormBtn').hidden = true;
    document.getElementById('campaignName').focus();
  }
  function hideCampaignForm() {
    document.getElementById('campaignForm').hidden = true;
    document.getElementById('toggleCampaignFormBtn').hidden = false;
    document.getElementById('campaignForm').reset();
    showMsg('campaignMsg', '');
  }
  document.getElementById('toggleCampaignFormBtn').addEventListener('click', showCampaignForm);
  document.getElementById('cancelCampaignFormBtn').addEventListener('click', hideCampaignForm);

  document.getElementById('campaignForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const payload = {
      brand_id: Number(form.brand_id.value),
      name: form.name.value.trim(),
      description: form.description.value.trim() || null,
    };
    if (!payload.brand_id || !payload.name) {
      showMsg('campaignMsg', 'יש לבחור מותג ולמלא שם קמפיין', true);
      return;
    }
    try {
      await api('/api/campaigns', { method: 'POST', body: JSON.stringify(payload) });
      hideCampaignForm();
      currentPage = 1;
      await loadCampaigns();
    } catch (error) {
      showMsg('campaignMsg', error.message, true);
    }
  });

  document.getElementById('campaignRows').addEventListener('change', async (e) => {
    const selectCheckbox = e.target.closest('[data-select-campaign]');
    if (selectCheckbox) {
      const cid = Number(selectCheckbox.getAttribute('data-select-campaign'));
      if (selectCheckbox.checked) selectedCampaignIds.add(cid);
      else selectedCampaignIds.delete(cid);
      updateBulkToolbar();
      syncSelectAllCheckbox();
      return;
    }

    const statusId = e.target.getAttribute('data-status-for');
    if (!statusId) return;
    try {
      await api(`/api/campaigns/${statusId}`, { method: 'PUT', body: JSON.stringify({ status: e.target.value }) });
      showMsg('campaignMsg', '');
    } catch (error) {
      showMsg('campaignMsg', error.message, true);
      await loadCampaigns();
    }
  });

  document.getElementById('selectAllCampaigns')?.addEventListener('change', (e) => {
    const checked = e.target.checked;
    document.querySelectorAll('#campaignRows [data-select-campaign]').forEach((cb) => {
      cb.checked = checked;
      const cid = Number(cb.getAttribute('data-select-campaign'));
      if (checked) selectedCampaignIds.add(cid);
      else selectedCampaignIds.delete(cid);
    });
    updateBulkToolbar();
  });

  document.getElementById('bulkDeleteBtn').addEventListener('click', async () => {
    const ids = [...selectedCampaignIds];
    if (ids.length === 0) return;
    const typed = prompt(`הקמפיינים לא יימחקו — הם יועברו לארכיון (${ids.length} קמפיינים). להמשך, הקלד/י DELETE:`);
    if (typed !== 'DELETE') return;
    const btn = document.getElementById('bulkDeleteBtn');
    btn.disabled = true;
    const results = await Promise.allSettled(ids.map((cid) => api(`/api/campaigns/${cid}`, { method: 'DELETE' })));
    btn.disabled = false;
    const failedCount = results.filter((r) => r.status === 'rejected').length;
    if (failedCount > 0) {
      showMsg('campaignMsg', `${failedCount} מתוך ${ids.length} קמפיינים לא הועברו לארכיון בהצלחה`, true);
    } else {
      showMsg('campaignMsg', `${ids.length} קמפיינים הועברו לארכיון בהצלחה`, false);
    }
    await loadCampaigns();
  });

  document.getElementById('campaignRows').addEventListener('click', async (e) => {
    const duplicateBtn = e.target.closest('[data-duplicate-campaign]');
    if (duplicateBtn) {
      const duplicateId = duplicateBtn.getAttribute('data-duplicate-campaign');
      duplicateBtn.disabled = true;
      try {
        const copy = await api(`/api/campaigns/${duplicateId}/duplicate`, { method: 'POST' });
        location.href = `/edit.html?id=${copy.id}`;
      } catch (error) {
        showMsg('campaignMsg', error.message, true);
        duplicateBtn.disabled = false;
      }
      return;
    }

    const deleteBtn = e.target.closest('[data-delete-campaign]');
    const id = deleteBtn && deleteBtn.getAttribute('data-delete-campaign');
    if (!id) return;
    const typed = prompt('הקמפיין לא יימחק — הוא יועבר לארכיון. להמשך, הקלד/י DELETE:');
    if (typed !== 'DELETE') return;
    try {
      await api(`/api/campaigns/${id}`, { method: 'DELETE' });
      await loadCampaigns();
    } catch (error) {
      showMsg('campaignMsg', error.message, true);
    }
  });

  document.getElementById('filterBrand').addEventListener('change', () => {
    currentPage = 1;
    loadCampaigns();
  });

  document.getElementById('filterStatus').addEventListener('change', () => {
    currentPage = 1;
    loadCampaigns();
  });

  document.getElementById('campaignHeaderRow').addEventListener('click', (e) => {
    const th = e.target.closest('th[data-sort]');
    if (!th) return;
    const field = th.getAttribute('data-sort');
    if (sortState.sort === field) {
      sortState.order = sortState.order === 'asc' ? 'desc' : 'asc';
    } else {
      sortState.sort = field;
      sortState.order = 'asc';
    }
    currentPage = 1;
    loadCampaigns();
  });

  initAuth().then((ok) => {
    if (!ok) return;
    checkStatus();
    loadBrands().then(loadCampaigns);
  });
</script>
</body>
</html>
